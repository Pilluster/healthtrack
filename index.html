.bsm{padding:7px 14px;background:var(--acc);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.errb{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px;}
.okb{background:rgba(110,231,183,.1);border:1px solid rgba(110,231,183,.3);color:var(--acc);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:8px;text-align:center;}
.ld{position:fixed;inset:0;background:rgba(13,13,15,.92);display:flex;align-items:center;justify-content:center;z-index:999;color:var(--acc);font-size:14px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a2a1a;border:1px solid var(--acc);color:var(--acc);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:998;opacity:0;transition:opacity .3s;pointer-events:none;}

.pscr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#1a1a2e,var(--bg) 60%);}
.pcard{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:24px;width:100%;max-width:420px;}

.pinp{width:100%;background:var(--fnt);border:1px solid var(--bdr);border-radius:10px;color:var(--txt);font-family:'DM Mono';font-size:18px;padding:12px 14px;outline:none;margin-bottom:14px;}

.shell{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--sur);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.tlogo{font-family:'Syne';font-size:15px;font-weight:700;color:var(--acc);}
.tsub{font-size:11px;color:var(--mut);margin-top:1px;}
.ibtn{background:var(--fnt);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:16px;padding:6px 10px;cursor:pointer;}

.bni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;color:var(--mut);font-size:10px;gap:3px;border-top:2px solid transparent;transition:color .2s;}

.bni-icon{font-size:20px;}
.pgc{flex:1;padding:16px;max-width:620px;margin:0 auto;width:100%;padding-bottom:80px;}

.dnavl{font-family:'Syne';font-size:16px;font-weight:700;min-width:150px;text-align:center;}

.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.sumitem{text-align:center;}
.sumval{font-family:'DM Mono';font-size:16px;font-weight:600;}
.sumlbl{font-size:10px;color:var(--mut);margin-top:2px;}
.calbar-wrap{margin-top:4px;}
.calbar-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.calbar-track{height:6px;background:var(--fnt);border-radius:3px;overflow:hidden;}
.calbar-fill{height:100%;background:linear-gradient(to right,#6ee7b7,#34d399);border-radius:3px;transition:width .4s;}

.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.stitle{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;}
/* ACTIVITY */
.actgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.actbtn{padding:6px 12px;border:1px solid var(--bdr);border-radius:20px;background:none;color:var(--mut);font-size:12px;cursor:pointer;transition:all .15s;}
.actbtn.on{border-color:var(--acc);color:var(--acc);background:rgba(110,231,183,.08);}
/* MEALS */

.mdesc{font-size:12px;color:var(--mut);margin-bottom:6px;font-style:italic;line-height:1.5;}

.ainote{font-size:10px;color:var(--mut);margin-top:5px;}

.mtitle{font-family:'Syne';font-size:17px;font-weight:700;}
.xbtn{background:var(--fnt);border:1px solid var(--bdr);color:var(--txt);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}

.slw{margin-bottom:12px;}
.slh{display:flex;justify-content:space-between;margin-bottom:4px;}
.sll{font-size:12px;color:var(--mut);}
.slv{font-size:12px;font-family:'DM Mono';color:var(--acc);}
input[type=range]{width:100%;accent-color:var(--acc);}
/* HISTORY */
.hrow{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:13px 14px;cursor:pointer;margin-bottom:8px;transition:border .15s;}
.hrow:hover{border-color:var(--acc);}
/* MEDS */
.meditem{background:var(--fnt);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}

.pgrd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}

.pstv{font-family:'DM Mono';font-size:13px;font-weight:600;}
.pstl{font-size:10px;color:var(--mut);margin-top:1px;}
.sdot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.dok{background:#22c55e;color:#fff;}
.dwn{background:var(--red);color:#fff;}
.dtabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.dtab{padding:6px 14px;border:1px solid var(--bdr);border-radius:20px;background:none;color:var(--mut);font-size:12px;cursor:pointer;}

.agrd{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.acrd{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px;text-align:center;}

.empty{text-align:center;color:var(--mut);padding:24px;font-size:13px;}
.pgf{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.chat-wrap{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.chat-bot{background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.2);border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:13px;color:#818cf8;max-width:90%;}

</style>

function lookupFood(text){
  const lower=text.toLowerCase().trim();
  // Direct match
  if(FDB[lower])return FDB[lower];
  // Partial match
  for(const key of Object.keys(FDB)){
    if(lower.includes(key)||key.includes(lower))return FDB[key];
  }
  return null;
}

// Parse quantity multiplier from text like "2 bowls", "3 chapati"
function parseQty(text){
  const m=text.match(/^(\d+(?:\.\d+)?)\s*/);
  return m?parseFloat(m[1]):1;
}

function localAnalyse(text){
  const lower=text.toLowerCase();
  const items=[];
  const tot={p:0,c:0,f:0,cal:0,fi:0};
  // Split by comma, "and", "+"
  const parts=lower.split(/,|\band\b|\+/);
  let matched=false;
  for(const part of parts){
    const trimmed=part.trim();
    if(!trimmed)continue;
    const qty=parseQty(trimmed);
    const food=lookupFood(trimmed.replace(/^\d+(\.\d+)?\s*/,''));
    if(food){
      matched=true;
      items.push({name:trimmed,portion:food.note,p:Math.round(food.p*qty),c:Math.round(food.c*qty),f:Math.round(food.f*qty),cal:Math.round(food.cal*qty),fi:Math.round(food.fi*qty)});
      tot.p+=food.p*qty;tot.c+=food.c*qty;tot.f+=food.f*qty;tot.cal+=food.cal*qty;tot.fi+=food.fi*qty;
    }
  }
  if(!matched)return null;
  return{items,totals:{p:Math.round(tot.p),c:Math.round(tot.c),f:Math.round(tot.f),cal:Math.round(tot.cal),fi:Math.round(tot.fi),conf:'high (from database)'}};
}

// ── GEMINI CALLS ─────────────────────────────────────────────
async function gCall(prompt){
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GK}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:800,temperature:0.1}})});
    const d=await r.json();
    return d.candidates?.[0]?.content?.parts?.[0]?.text||'';
  }catch(e){console.error('Gemini:',e);return'';}
}

async function gVision(b64,mime){
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GK}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:mime,data:b64}},{text:'Identify every food item in this image. For each item give estimated portion and nutrition. Return ONLY valid JSON no markdown:\n{"items":[{"name":"food","portion":"1 bowl","p":9,"c":20,"f":3,"cal":143,"fi":4}],"totals":{"p":0,"c":0,"f":0,"cal":0,"fi":0,"conf":"medium"},"desc":"description"}'}]}],generationConfig:{maxOutputTokens:600,temperature:0.1}})});
    const d=await r.json();
    if(!d.candidates?.[0]){console.error('Vision:',JSON.stringify(d));return null;}
    return parseJ(d.candidates[0].content?.parts?.[0]?.text||'');
  }catch(e){console.error('Vision:',e);return null;}
}

function parseJ(text){
  let c=text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  try{return JSON.parse(c);}catch(e){}
  const m=c.match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e2){}}
  return null;
}

async function analyseFood(text){
  // 1. Try local database first (instant, no API needed)
  const local=localAnalyse(text);
  if(local)return local;
  // 2. Try Gemini API
  const prompt=`You are a nutritionist. Analyse this meal and estimate nutrition.\n\nReference values:\nPoha 1 plate: p=4 c=32 f=4 cal=177\nDal 1 bowl: p=9 c=20 f=3 cal=143\nRice 1 bowl: p=4 c=45 f=0.5 cal=200\nChapati 1pc: p=3 c=18 f=1 cal=93\nEgg 1pc: p=6 c=0.5 f=5 cal=77\nPaneer 100g: p=18 c=4 f=20 cal=265\nDal chawal: p=13 c=65 f=3 cal=343\nBanana shake: p=8 c=38 f=5 cal=225\nChicken 100g: p=27 c=0 f=3 cal=136\nMilk 250ml: p=8 c=12 f=8 cal=149\nDahi 150g: p=5 c=6 f=4 cal=76\n\nMeal: "${text}"\n\nReturn ONLY valid JSON:\n{"items":[{"name":"item","portion":"portion","p":0,"c":0,"f":0,"cal":0,"fi":0}],"totals":{"p":0,"c":0,"f":0,"cal":0,"fi":0,"conf":"medium"}}`;
  const resp=await gCall(prompt);
  if(!resp)return null;
  return parseJ(resp);
}

// Recalc including supplement macros
function rcFull(log){
  const meals=log.meals||[];
  const t=rc(meals);
  // Add supplement macros for taken supplements
  (log.supplements||[]).forEach(s=>{
    if(s.taken&&SUPMACROS[s.name]){
      const sm=SUPMACROS[s.name];
      t.p+=sm.p||0;t.c+=sm.c||0;t.f+=sm.f||0;t.cal+=sm.cal||0;t.fi+=sm.fi||0;
    }
  });
  return{p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f),cal:Math.round(t.cal),fi:Math.round(t.fi)};
}

  document.getElementById('act-custom-wrap').style.display=isCustom?'block':'none';

async function saveCustomAct(){

  if(!LOG.activity)LOG.activity={};

}

async function saveDur(){
  if(!LOG.activity)LOG.activity={};
  LOG.activity.duration=document.getElementById('act-dur').value;
  await setLog(CU.id,VD,LOG);
}

async function saveW(ml){
  LOG.water=ml/1000;
  await setLog(CU.id,VD,LOG);
}

async function addW(v){
  const nw=Math.min(5,Math.round(((parseFloat(LOG.water)||0)+v)*10)/10);
  LOG.water=nw;await setLog(CU.id,VD,LOG);
  const sl=document.getElementById('wsl');if(sl)sl.value=nw*1000;
  const wd=document.getElementById('wdisp');if(wd)wd.textContent=nw.toFixed(1)+'L';

async function delM(i){
  if(!confirm('Remove this meal?'))return;
  LOG.meals.splice(i,1);
  await setLog(CU.id,VD,LOG);
  renderToday();
}

async function doText(){
  const txt=(document.getElementById('mtxt').value||'').trim();
  if(!txt){alert('Describe your meal first.');return;}
  const btn=document.getElementById('abtn-txt');
  btn.textContent='⏳ Analysing...';btn.disabled=true;
  const r=await analyseFood(txt);
  btn.textContent='🤖 Analyse nutrition';btn.disabled=false;
  if(!r){
    // Show clarification prompt
    showClarify(txt);
    return;
  }
  MEAL.desc=txt;MEAL.result=r;

}

function showClarify(originalText){
  const resultDiv=document.getElementById('mresult');
  resultDiv.style.display='block';
  resultDiv.innerHTML=`
    <div class="chat-wrap">
      <div class="chat-bot">I wasn't able to identify "<strong>${originalText}</strong>" from my database. Let me ask a couple of questions to estimate better.</div>

        <div class="clarify-opts" style="margin-top:8px">

        </div>
      </div>
    </div>

function pickClarify(key,val,el){
  document.querySelectorAll(`[onclick*="pickClarify('${key}"`).forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  MEAL.clarifyAnswers[key]=val;
}

async function submitClarify(originalText){
  const qty=MEAL.clarifyAnswers.qty||'1 serving';
  const oil=MEAL.clarifyAnswers.oil||'Light oil';
  const enriched=`${qty} of ${originalText}, cooked with ${oil}`;
  const btn=document.querySelector('#mresult .abtn');
  if(btn){btn.textContent='⏳ Estimating...';btn.disabled=true;}
  const r=await analyseFood(enriched);
  if(btn){btn.textContent='🤖 Estimate with these details';btn.disabled=false;}
  if(!r){
    // Final fallback — generic estimate
    const calMap={'Small portion':150,'1 serving / bowl':300,'Large portion':450,'2 servings':600};
    const oilMap={'No oil':0,'Light oil':20,'Moderate oil/ghee':45,'Heavy ghee':90};
    const baseCal=(calMap[MEAL.clarifyAnswers.qty]||300)+(oilMap[MEAL.clarifyAnswers.oil]||20);
    MEAL.result={items:[{name:originalText,portion:qty,p:Math.round(baseCal*0.08),c:Math.round(baseCal*0.5/4),f:Math.round(baseCal*0.25/9),cal:baseCal,fi:2}],totals:{p:Math.round(baseCal*0.08),c:Math.round(baseCal*0.5/4),f:Math.round(baseCal*0.25/9),cal:baseCal,fi:2,conf:'rough estimate'}};
    MEAL.desc=enriched;
    showMResult(MEAL.result);
    return;
  }
  MEAL.desc=enriched;MEAL.result=r;
  showMResult(r);
}

function handlePh(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    MEAL.b64=e.target.result.split(',')[1];MEAL.mime=file.type;MEAL.photoUrl=e.target.result;
    document.getElementById('ph-prev').innerHTML=`<img src="${e.target.result}" style="width:100%;border-radius:8px;max-height:220px;object-fit:cover">`;
    document.getElementById('abtn-ph').style.display='block';
  };
  reader.readAsDataURL(file);
}

function doManual(){
  const p=parseFloat(document.getElementById('man-p').value)||0;
  const c=parseFloat(document.getElementById('man-c').value)||0;
  const f=parseFloat(document.getElementById('man-f').value)||0;
  const fi=parseFloat(document.getElementById('man-fi').value)||0;
  const qty=document.getElementById('man-qty').value||'';
  let cal=parseFloat(document.getElementById('man-cal').value);
  if(!cal)cal=Math.round(p*4+c*4+f*9);
  const name=(document.getElementById('mn').value||'').trim()||'Custom entry';
  MEAL.result={items:[{name,portion:qty||'custom',p,c,f,cal,fi}],totals:{p,c,f,cal,fi,conf:'manual'}};
  showMResult(MEAL.result);
}

async function loadHistory(){
  const logs=await logsN(CU.id,30);
  const dates=Object.keys(logs).sort((a,b)=>b.localeCompare(a));
  let html=`<div style="font-family:'Syne';font-size:18px;font-weight:700;margin-bottom:14px">Last 30 days</div>`;
  let any=false;
  for(const d of dates){
    const log=logs[d];
    if(!log.meals?.length&&!log.activity?.type&&!log.journal)continue;
    any=true;
    const t=rcFull(log);
    const meds=log.meds||[];
    const medsMissed=meds.filter(m=>!m.taken).length;
    html+=`<div class="hrow" onclick="jumpDay('${d}')">
      <div>
        <div style="font-size:14px;font-weight:600">${fdate(d)}</div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${log.activity?.type||'No activity'} ${log.journal?'· 📝 Journal':''}${medsMissed>0?` · <span style="color:var(--red)">${medsMissed} med(s) missed</span>`:''}</div>
      </div>
      <div style="text-align:right">
        <div style="display:flex;gap:8px;justify-content:flex-end;font-size:11px;font-family:'DM Mono'">
          <span style="color:#4ade80">P:${t.p}g</span><span style="color:#fbbf24">${t.cal}kcal</span>
        </div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${log.meals?.length||0} meals · ${(log.water||0).toFixed(1)}L</div>
      </div>
    </div>`;
  }
  if(!any)html+=`<div class="empty">No history yet.</div>`;
  document.getElementById('pgc').innerHTML=html;
}

async function loadMeds(){
  const log=await getLog(CU.id,today());
  LOG=log;
  const meds=log.meds||[];
  const sups=log.supplements||[];
  const regMeds=CU.profile.regMeds||[];

  // Check which regular meds are not yet in today's log
  const loggedMedNames=meds.map(m=>m.name.toLowerCase());
  const missingRegMeds=regMeds.filter(m=>!loggedMedNames.includes(m.name.toLowerCase()));

  document.getElementById('pgc').innerHTML=`
  <div style="display:flex;flex-direction:column;gap:14px">
    ${missingRegMeds.length>0?`
    <div style="background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:12px;padding:12px 14px">
      <div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:8px">⚠ Regular medications not yet logged today</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${missingRegMeds.map(m=>`<button onclick="quickAddRegMed('${m.name}','${m.dose||''}','${m.timing||''}')" style="padding:5px 12px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:16px;color:var(--red);font-size:12px;cursor:pointer">+ ${m.name}</button>`).join('')}
      </div>
    </div>`:''}

    <div class="sc">
      <div class="shdr">
        <div class="stitle">Medications today</div>
        <div style="display:flex;gap:6px">
          <button class="bsm" style="background:rgba(129,140,248,.2);color:#818cf8;border:1px solid rgba(129,140,248,.3)" onclick="manageRegMeds()">Manage regular</button>
          <button class="bsm" onclick="addMedMod()">+ Add</button>
        </div>
      </div>
      ${meds.length===0?`<div class="empty">No medications logged today.</div>`:''}
      ${meds.map((m,i)=>`<div class="meditem ${!m.taken&&m.scheduledTime?'med-missed':''}">
        <div>
          <div style="font-size:13px;font-weight:600">${m.name}</div>
          <div style="font-size:11px;color:var(--mut);margin-top:2px">${m.dose||''} ${m.timing?'· '+m.timing:''}${m.takenAt?` · Taken at ${m.takenAt}`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:22px;cursor:pointer" onclick="togMed(${i})">${m.taken?'✅':'⬜'}</span>
          <button class="delbtn" onclick="delMed(${i})">✕</button>
        </div>
      </div>`).join('')}
      ${meds.length>0?`<div style="font-size:12px;color:var(--mut);margin-top:8px;padding-top:8px;border-top:1px solid var(--fnt)">${meds.filter(m=>m.taken).length}/${meds.length} taken today</div>`:''}
    </div>

    <div class="sc">
      <div class="shdr"><div class="stitle">Supplements today</div><button class="bsm" onclick="addSupMod()">+ Add</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
        ${['Protein scoop','Multivitamin','Omega-3','Vitamin D','Vitamin B12','Calcium','Iron','Zinc','Magnesium','Creatine','Collagen'].map(s=>`<button onclick="quickSup('${s}')" style="padding:4px 11px;background:var(--fnt);border:1px solid var(--bdr);border-radius:16px;color:var(--mut);font-size:11px;cursor:pointer">${s}</button>`).join('')}
      </div>
      ${sups.length===0?`<div class="empty">No supplements today.</div>`:''}
      ${sups.map((s,i)=>`<div class="meditem">
        <div>
          <div style="font-size:13px;font-weight:600">${s.name}</div>
          <div style="font-size:11px;color:var(--mut);margin-top:2px">${s.dose||''} ${s.timing?'· '+s.timing:''}${SUPMACROS[s.name]?.p>0?` · <span style="color:#4ade80">+${SUPMACROS[s.name].p}g protein</span>`:SUPMACROS[s.name]?.cal>0?` · +${SUPMACROS[s.name].cal}kcal`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:22px;cursor:pointer" onclick="togSup(${i})">${s.taken?'✅':'⬜'}</span>
          <button class="delbtn" onclick="delSup(${i})">✕</button>
        </div>
      </div>`).join('')}
      ${sups.some(s=>s.taken&&SUPMACROS[s.name]?.cal>0)?`<div style="font-size:12px;color:var(--acc);margin-top:8px">✓ Taken supplement macros are included in your daily nutrition totals</div>`:''}
    </div>
  </div>`;
}

async function saveMed(){
  const name=(document.getElementById('mdn').value||'').trim();
  if(!name){alert('Enter medication name');return;}
  const med={name,dose:document.getElementById('mdd').value,timing:document.getElementById('mdt').value,notes:document.getElementById('mdno').value,taken:false,addedAt:new Date().toISOString()};
  if(!LOG.meds)LOG.meds=[];
  LOG.meds.push(med);
  await setLog(CU.id,today(),LOG);
  // Also add to regular meds if checked
  if(document.getElementById('mdreg').checked){
    const regMeds=CU.profile.regMeds||[];
    regMeds.push({name:med.name,dose:med.dose,timing:med.timing});
    await setP(CU.id,{regMeds});
    CU.profile.regMeds=regMeds;
  }
  closeMod();toast('✓ Medication added');loadMeds();
}

async function togMed(i){
  LOG.meds[i].taken=!LOG.meds[i].taken;
  if(LOG.meds[i].taken)LOG.meds[i].takenAt=nowIST();
  else delete LOG.meds[i].takenAt;
  await setLog(CU.id,today(),LOG);loadMeds();
}
async function delMed(i){if(!confirm('Remove?'))return;LOG.meds.splice(i,1);await setLog(CU.id,today(),LOG);loadMeds();}

async function quickAddRegMed(name,dose,timing){
  if(!LOG.meds)LOG.meds=[];
  LOG.meds.push({name,dose,timing,taken:false,addedAt:new Date().toISOString()});
  await setLog(CU.id,today(),LOG);toast('✓ '+name+' added');loadMeds();
}

async function loadDocPats(){
  const patients=await allP();
  const T=today();
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="font-family:'Syne';font-size:20px;font-weight:700">${patients.length} patients</div>
    <div style="display:flex;gap:8px">
      <select class="fs" id="rng" onchange="loadDocPats()" style="width:auto;padding:6px 10px"><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
      <button class="bsm" onclick="showCreate()">+ Add patient</button>
    </div>
  </div><div class="pgrd">`;

  for(const p of patients){
    const days=parseInt(document.getElementById('rng')?.value||'7');
    const logs=await logsN(p.id,days);
    const logged=Object.values(logs).filter(l=>l.meals?.length||l.activity?.type||l.journal).length;
    const avgP=logged?Math.round(Object.values(logs).reduce((s,l)=>s+rcFull(l).p,0)/logged):0;
    const lastLog=Object.entries(logs).filter(([,l])=>l.meals?.length||l.activity?.type).sort((a,b)=>b[0].localeCompare(a[0]))[0];
    const todayOk=!!(logs[T]?.meals?.length||logs[T]?.activity?.type);
    const medsMissed=Object.values(logs).reduce((s,l)=>{return s+(l.meds||[]).filter(m=>!m.taken).length;},0);
    html+=`<div class="pcrd" onclick="viewPat('${p.id}')">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="pavtr">${p.name?.[0]||'?'}</div>
        <div style="flex:1"><div style="font-size:14px;font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--mut);margin-top:2px">${p.age||'?'} · ${p.gender||''} · ${p.id}</div></div>
        <div class="sdot ${todayOk?'dok':'dwn'}">${todayOk?'✓':'!'}</div>
      </div>
      <div class="psts">
        <div class="pst"><div class="pstv">${logged}/${days}</div><div class="pstl">days logged</div></div>
        <div class="pst"><div class="pstv" style="color:#4ade80">${avgP}g</div><div class="pstl">avg protein</div></div>
        <div class="pst"><div class="pstv">${lastLog?fdate(lastLog[0]):'Never'}</div><div class="pstl">last active</div></div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${p.goal?`<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:var(--fnt);color:var(--mut)">${p.goal}</span>`:''}
        ${p.conditions?`<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(251,191,36,.1);color:var(--yel)">⚕ ${p.conditions}</span>`:''}
        ${medsMissed>0?`<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(248,113,113,.1);color:var(--red)">💊 ${medsMissed} missed</span>`:''}
      </div>
    </div>`;
  }
  html+=`</div>`;
  document.getElementById('pgc').innerHTML=html;
}

async function viewPat(pid){
  showL('Loading...');
  const p=await getP(pid);const logs=await logsN(pid,30);const notes=await getNotes(pid);
  hideL();
  const ld=Object.keys(logs).filter(d=>logs[d].meals?.length||logs[d].activity?.type||logs[d].journal).sort((a,b)=>b.localeCompare(a));
  const avg={p:0,c:0,f:0,cal:0,fi:0,energy:0,sleep:0,water:0};
  ld.forEach(d=>{const t=rcFull(logs[d]);avg.p+=t.p;avg.c+=t.c;avg.f+=t.f;avg.cal+=t.cal;avg.fi+=t.fi;avg.energy+=logs[d].energy||0;avg.sleep+=logs[d].sleep||0;avg.water+=logs[d].water||0;});
  const n=ld.length||1;Object.keys(avg).forEach(k=>avg[k]=Math.round(avg[k]/n*10)/10);
  const actC={};ld.forEach(d=>{const t=logs[d].activity?.type;if(t)actC[t]=(actC[t]||0)+1;});
  // Med compliance
  const medComp={};
  ld.forEach(d=>{(logs[d].meds||[]).forEach(m=>{if(!medComp[m.name])medComp[m.name]={taken:0,total:0};medComp[m.name].total++;if(m.taken)medComp[m.name].taken++;});});
  window._PD={p,logs,ld,avg};

  document.getElementById('pgc').innerHTML=`
  <div>
    <button onclick="loadDocPats()" style="background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;padding:0 0 14px">← All patients</button>
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div class="pavtr lg">${p.name?.[0]}</div>
      <div style="flex:1">
        <div style="font-family:'Syne';font-size:20px;font-weight:700">${p.name}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:2px">${p.age||'?'} · ${p.gender||''} · ${p.dietStyle||''}</div>
        <div style="font-size:12px;color:var(--mut)">Goal: ${p.goal||'—'} · ID: ${pid}</div>
        ${p.conditions?`<div style="font-size:11px;color:var(--yel);background:rgba(251,191,36,.1);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px">⚕ ${p.conditions}</div>`:''}
      </div>
      <button class="bsm" style="background:rgba(129,140,248,.2);color:#818cf8;border:1px solid rgba(129,140,248,.3)" onclick="genAI('${pid}')">🤖 AI Summary</button>
    </div>
    <div id="aibox" style="display:none" class="aibox">
      <div style="font-size:11px;color:#818cf8;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">🤖 AI Patient Summary</div>
      <div id="aic" style="font-size:13px;color:#ccc;line-height:1.85;white-space:pre-wrap">Generating...</div>
    </div>
    <div class="dtabs">
      <button class="dtab on" onclick="dTab('nutrition',this)">Nutrition</button>
      <button class="dtab" onclick="dTab('activity',this)">Activity</button>
      <button class="dtab" onclick="dTab('meds',this)">Medications</button>
      <button class="dtab" onclick="dTab('logs',this)">Daily logs</button>
      <button class="dtab" onclick="dTab('notes',this)">Notes</button>
      <button class="dtab" onclick="dTab('targets',this)">Targets</button>
    </div>

    <div id="dt-nutrition">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">30-day averages · ${ld.length} days logged</div>
      <div class="agrd">
        ${ac('Avg protein',avg.p+'g',p.targets?.protein,'g','#4ade80')}
        ${ac('Avg calories',avg.cal+' kcal',p.targets?.calories,' kcal','#fbbf24')}
        ${ac('Avg carbs',avg.c+'g',null,null,'#60a5fa')}
        ${ac('Avg fat',avg.f+'g',null,null,'#f472b6')}
        ${ac('Avg fibre',avg.fi+'g',null,null,'#fb923c')}
        ${ac('Avg water',avg.water+'L',null,null,'#67e8f9')}
        ${ac('Avg energy',avg.energy+'/10',null,null,'#a78bfa')}
        ${ac('Avg sleep',avg.sleep+'/10',null,null,'#818cf8')}
      </div>
    </div>

    <div id="dt-activity" style="display:none">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Activity breakdown</div>
      ${Object.entries(actC).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--fnt)"><div style="font-size:12px;width:180px;flex-shrink:0">${t}</div><div style="flex:1;height:6px;background:var(--fnt);border-radius:3px;overflow:hidden"><div style="height:100%;background:var(--acc);border-radius:3px;width:${Math.round(c/ld.length*100)}%"></div></div><div style="font-size:12px;color:var(--mut);font-family:'DM Mono';width:40px;text-align:right">${c}d</div></div>`).join('')||'<div class="empty">No activity data</div>'}
    </div>

    <div id="dt-meds" style="display:none">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Medication compliance (30 days)</div>
      ${Object.keys(medComp).length===0?'<div class="empty">No medication data logged</div>':''}
      ${Object.entries(medComp).map(([name,mc])=>{
        const pct=Math.round(mc.taken/mc.total*100);
        const col=pct>=80?'#4ade80':pct>=60?'#fbbf24':'#f87171';
        return`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:500">${name}</span><span style="font-family:'DM Mono';color:${col}">${mc.taken}/${mc.total} (${pct}%)</span></div><div style="height:6px;background:var(--fnt);border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;background:${col};width:${pct}%"></div></div></div>`;
      }).join('')}
      ${p.regMeds?.length>0?`<div style="margin-top:12px;font-size:12px;color:var(--mut)">Regular medications: ${p.regMeds.map(m=>m.name).join(', ')}</div>`:''}
    </div>

    <div id="dt-logs" style="display:none">
      ${ld.slice(0,14).map(d=>{const l=logs[d],t=rcFull(l);return`<div style="padding:10px 0;border-bottom:1px solid var(--fnt)"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div style="width:110px;font-size:13px;font-weight:500">${fdate(d)}</div><div style="flex:1;font-size:12px;color:var(--mut)">${l.activity?.type||'—'}</div><div style="font-size:11px;font-family:'DM Mono';color:var(--mut)">P:${t.p}g ${t.cal}kcal ${l.meals?.length||0}m</div></div>${l.journal?`<div style="font-size:11px;color:var(--mut);font-style:italic;margin-top:4px">"${l.journal.substring(0,100)}"</div>`:''}</div>`;}).join('')||'<div class="empty">No logs yet</div>'}
    </div>

    <div id="dt-notes" style="display:none">
      <div style="margin-bottom:14px">
        <label class="fl">Write note for ${p.name}</label>
        <textarea class="ft" id="newnote" rows="3" placeholder="Recommendations, observations, instructions..."></textarea>
        <button class="bsm" style="margin-top:8px;width:100%" onclick="sendNote('${pid}')">Send note to patient</button>
      </div>
      ${notes.map(note=>`<div class="notecard"><div style="font-size:11px;color:var(--mut);margin-bottom:4px">${new Date(note.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><div style="font-size:13px;line-height:1.6">${note.note}</div></div>`).join('')}
      ${notes.length===0?'<div class="empty">No notes yet</div>':''}
    </div>

    <div id="dt-targets" style="display:none">
      <div style="max-width:280px;display:flex;flex-direction:column;gap:10px">
        <div><label class="fl">Daily protein (g)</label><input class="fi" id="tgtp" type="number" value="${p.targets?.protein||100}"></div>
        <div><label class="fl">Daily calories (kcal)</label><input class="fi" id="tgtc" type="number" value="${p.targets?.calories||2000}"></div>
        <div><label class="fl">Activity days/week</label><input class="fi" id="tgta" type="number" value="${p.targets?.activityDays||4}" min="0" max="7"></div>
        <button class="bsm" style="width:100%" onclick="saveTgts('${pid}')">Save targets</button>
        <div id="tgtsaved" style="display:none" class="okb">✓ Targets updated</div>
      </div>
    </div>
    <div style="height:30px"></div>
  </div>`;
}

function dTab(tab,el){
  document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  ['nutrition','activity','meds','logs','notes','targets'].forEach(t=>{const e=document.getElementById('dt-'+t);if(e)e.style.display=t===tab?'block':'none';});
}
function ac(l,v,target,unit,color){return`<div class="acrd"><div style="font-size:10px;color:var(--mut);text-transform:uppercase;margin-bottom:4px">${l}</div><div style="font-family:'DM Mono';font-size:17px;font-weight:600;color:${color}">${v}</div>${target?`<div style="font-size:10px;color:var(--mut)">Target: ${target}${unit}</div>`:''}</div>`;}

async function genAI(pid){
  const box=document.getElementById('aibox'),ct=document.getElementById('aic');
  if(!box)return;box.style.display='block';ct.textContent='Generating summary...';box.scrollIntoView({behavior:'smooth',block:'nearest'});
  const{p,logs,ld,avg}=window._PD||{};
  if(!ld?.length){ct.textContent='No logged data yet. Need at least 1 day.';return;}
  try{
    const rs=ld.slice(0,7).map(d=>{const l=logs[d],t=rcFull(l);return`${fdate(d)}: activity=${l.activity?.type||'none'} P=${t.p}g cal=${t.cal} energy=${l.energy||'?'}/10 sleep=${l.sleep||'?'}/10 meals=[${(l.meals||[]).map(m=>m.name).join(', ')||'none'}] journal="${(l.journal||'').substring(0,80)}"`;}).join('\n');
    const prompt=`Healthcare professional reviewing patient data.\n\nPatient: ${p.name}, ${p.age||'?'} yrs, ${p.gender||''}\nDiet: ${p.dietStyle||'?'} | Goal: ${p.goal||'?'} | Conditions: ${p.conditions||'None'}\nTargets: Protein ${p.targets?.protein||100}g/day, Calories ${p.targets?.calories||2000}/day\n\n30-day averages (${ld.length} days):\nProtein ${avg.p}g | Calories ${avg.cal} | Carbs ${avg.c}g | Fat ${avg.f}g | Fibre ${avg.fi}g | Water ${avg.water}L | Energy ${avg.energy}/10 | Sleep ${avg.sleep}/10\n\nRecent 7 days:\n${rs}\n\nProvide:\nOVERALL STATUS: Good/Needs attention/Concerning\nNUTRITION ANALYSIS:\nACTIVITY PATTERN:\nAREAS OF CONCERN:\nRECOMMENDATIONS: (3 specific actions)\n\nUnder 250 words. Professional.`;
    const result=await gCall(prompt);
    ct.textContent=result||'Empty response. Check API key quota.';
  }catch(e){ct.textContent='Error: '+e.message;}
}

async function sendNote(pid){
  const note=(document.getElementById('newnote').value||'').trim();if(!note)return;
  await addNote(pid,note);document.getElementById('newnote').value='';
  toast('✓ Note sent to patient');await viewPat(pid);
  dTab('notes',document.querySelectorAll('.dtab')[4]);
}

async function saveTgts(pid){
  const targets={protein:parseInt(document.getElementById('tgtp').value)||100,calories:parseInt(document.getElementById('tgtc').value)||2000,activityDays:parseInt(document.getElementById('tgta').value)||4};
  await setP(pid,{targets});if(window._PD)window._PD.p.targets=targets;
  document.getElementById('tgtsaved').style.display='block';
}

async function loadAlerts(){
  showL('Checking...');const patients=await allP();const T=today();
  const crit=[],warn=[];
  for(const p of patients){
    const logs=await logsN(p.id,7);
    let consec=0;for(let i=0;i<7;i++){const d=shift(T,-i);if(!logs[d]?.meals?.length&&!logs[d]?.activity?.type&&!logs[d]?.journal)consec++;else break;}
    const ldays=Object.values(logs).filter(l=>l.meals?.length);
    const avgP=ldays.length?ldays.reduce((s,l)=>s+rcFull(l).p,0)/ldays.length:0;
    const highPain=Object.values(logs).filter(l=>(l.pain||0)>=7).length;
    const medsMissed=Object.values(logs).reduce((s,l)=>s+(l.meds||[]).filter(m=>!m.taken).length,0);
    if(consec>=3)crit.push({pid:p.id,name:p.name,icon:'📵',msg:`Not logged in ${consec} consecutive days`,bg:'rgba(248,113,113,.15)'});
    if(ldays.length>=3&&avgP<(p.targets?.protein||100)*0.5)crit.push({pid:p.id,name:p.name,icon:'⚠️',msg:`Protein critically low: avg ${Math.round(avgP)}g vs target`,bg:'rgba(248,113,113,.15)'});
    if(highPain>=2)warn.push({pid:p.id,name:p.name,icon:'🔴',msg:`High pain (7+/10) on ${highPain} days`,bg:'rgba(251,191,36,.15)'});
    if(medsMissed>=5)warn.push({pid:p.id,name:p.name,icon:'💊',msg:`${medsMissed} missed medication doses this week`,bg:'rgba(248,113,113,.1)'});
    if(ldays.length>=3&&avgP<(p.targets?.protein||100)*0.75&&avgP>=(p.targets?.protein||100)*0.5)warn.push({pid:p.id,name:p.name,icon:'🥗',msg:`Low protein avg: ${Math.round(avgP)}g/day`,bg:'rgba(251,191,36,.15)'});
  }
  hideL();const all=[...crit,...warn];
  document.getElementById('pgc').innerHTML=`
  <button onclick="loadDocPats()" style="background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;padding:0 0 14px">← All patients</button>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div style="font-family:'Syne';font-size:18px;font-weight:700">${all.length} alerts</div><div style="font-size:12px;color:var(--mut)">${crit.length} critical · ${warn.length} warnings</div></div>
  ${all.length===0?'<div class="empty" style="margin-top:40px">✅ All patients on track.</div>':''}
  ${crit.length?`<div style="font-size:11px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Critical</div>`:''}
  ${crit.map(a=>`<div class="alertrow" onclick="viewPat('${a.pid}')"><div class="aicon" style="background:${a.bg}">${a.icon}</div><div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--mut);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--mut);margin-top:2px">${a.msg}</div></div></div>`).join('')}
  ${warn.length?`<div style="font-size:11px;color:var(--yel);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 8px">Warnings</div>`:''}
  ${warn.map(a=>`<div class="alertrow" onclick="viewPat('${a.pid}')"><div class="aicon" style="background:${a.bg}">${a.icon}</div><div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--mut);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--mut);margin-top:2px">${a.msg}</div></div></div>`).join('')}`;
}

// ── INIT — restore session or show login ──────────────────────
if(loadSession()){
  if(CU.type==='patient')showPat();
  else showDoc();
}else{
  showPin();
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════
// FIX PATCH — AI Summary, targets, journal toast, supplements,
//             history journal display, medication checkbox
// ═══════════════════════════════════════════════════════════════

// ── 1. AI SUMMARY FIX ────────────────────────────────────────
// Problem: window._PD not set when button clicked after page load
genAI = async function(pid) {
  const box = document.getElementById('aibox');
  const ct = document.getElementById('aic');
  if (!box || !ct) { alert('Scroll up to see AI summary box'); return; }
  box.style.display = 'block';
  ct.textContent = '⏳ Generating summary...';
  box.scrollIntoView({behavior:'smooth', block:'nearest'});

  // Re-fetch if _PD not set
  if (!window._PD || window._PD.p?.id !== pid) {
    showL('Fetching patient data...');
    const p = await getP(pid);
    const logs = await logsN(pid, 30);
    hideL();
    const ld = Object.keys(logs).filter(d => logs[d].meals?.length || logs[d].activity?.type || logs[d].journal).sort((a,b) => b.localeCompare(a));
    const avg = {p:0,c:0,f:0,cal:0,fi:0,energy:0,sleep:0,water:0};
    ld.forEach(d => {
      const t = rcFull(logs[d]);
      avg.p+=t.p; avg.c+=t.c; avg.f+=t.f; avg.cal+=t.cal; avg.fi+=t.fi;
      avg.energy+=logs[d].energy||0; avg.sleep+=logs[d].sleep||0; avg.water+=logs[d].water||0;
    });
    const n = ld.length||1;
    Object.keys(avg).forEach(k => avg[k] = Math.round(avg[k]/n*10)/10);
    window._PD = {p, logs, ld, avg};
  }

  const {p, logs, ld, avg} = window._PD;
  if (!ld?.length) { ct.textContent = 'No logged data yet. Patient needs to log at least 1 day first.'; return; }

  try {
    const rs = ld.slice(0,7).map(d => {
      const l = logs[d], t = rcFull(l);
      return `${fdate(d)}: activity=${l.activity?.type||'none'} P=${t.p}g cal=${t.cal} energy=${l.energy||'?'}/10 sleep=${l.sleep||'?'}/10 meals=[${(l.meals||[]).map(m=>m.name).join(', ')||'none'}] journal="${(l.journal||'').substring(0,100)}"`;
    }).join('\n');

    const prompt = `You are a healthcare professional reviewing a patient's health tracking data. Provide a concise clinical summary.

Patient: ${p.name}, ${p.age||'?'} years, ${p.gender||''}
Dietary style: ${p.dietStyle||'?'} | Health goal: ${p.goal||'?'}
Medical conditions: ${p.conditions||'None'} | Allergies: ${p.allergies||'None'}
Doctor targets: Protein ${p.targets?.protein||100}g/day, Calories ${p.targets?.calories||2000}/day

30-day averages (${ld.length} days logged):
Protein: ${avg.p}g | Calories: ${avg.cal} | Carbs: ${avg.c}g | Fat: ${avg.f}g | Fibre: ${avg.fi}g
Water: ${avg.water}L | Energy: ${avg.energy}/10 | Sleep: ${avg.sleep}/10

Recent 7 days detail:
${rs}

Provide a professional clinical summary with these sections:
OVERALL STATUS: (Good / Needs attention / Concerning)
NUTRITION ANALYSIS: Key findings about their diet
ACTIVITY PATTERN: Assessment of physical activity
AREAS OF CONCERN: Specific issues to address
RECOMMENDATIONS: 3 specific actionable steps for this patient

Keep under 250 words. Be direct and specific to their actual data.`;

    const result = await gCall(prompt);
    if (!result || result.trim() === '') {
      ct.textContent = 'Gemini returned empty response. This could mean:\n1. API key quota exceeded for today\n2. Network issue\n\nTry again in a few minutes.';
      return;
    }
    ct.style.whiteSpace = 'pre-wrap';
    ct.textContent = result;
  } catch(e) {
    ct.textContent = 'Error generating summary: ' + e.message;
    console.error('AI Summary error:', e);
  }
};

// ── 2. SAVE TARGETS FIX ───────────────────────────────────────
saveTgts = async function(pid) {
  const tgtp = document.getElementById('tgtp');
  const tgtc = document.getElementById('tgtc');
  const tgta = document.getElementById('tgta');
  const tgtsaved = document.getElementById('tgtsaved');
  if (!tgtp) { alert('Target fields not found'); return; }
  const targets = {
    protein: parseInt(tgtp.value)||100,
    calories: parseInt(tgtc.value)||2000,
    activityDays: parseInt(tgta.value)||4
  };
  try {
    await setP(pid, {targets});
    if (window._PD) window._PD.p.targets = targets;
    if (tgtsaved) { tgtsaved.style.display = 'block'; setTimeout(() => tgtsaved.style.display='none', 3000); }
    toast('✓ Targets saved for patient');
  } catch(e) {
    alert('Error saving targets: ' + e.message);
  }
};

// ── 3. JOURNAL TOAST + HISTORY DISPLAY ───────────────────────
saveJournal = async function() {
  const jnotes = document.getElementById('jnotes');
  const sl0 = document.getElementById('sl0');
  const sl1 = document.getElementById('sl1');
  const sl2 = document.getElementById('sl2');
  const sl3 = document.getElementById('sl3');
  if (!sl0) { alert('Journal fields not found'); return; }

  JLOG.energy = parseInt(sl0.value);
  JLOG.sleep  = parseInt(sl1.value);
  JLOG.stress = parseInt(sl2.value);
  JLOG.pain   = parseInt(sl3.value);
  JLOG.journal = jnotes ? jnotes.value : '';

  try {
    await setLog(CU.id, today(), JLOG);
    CACHE['l_'+CU.id+'_'+today()] = {...JLOG};
    const jsaved = document.getElementById('jsaved');
    if (jsaved) { jsaved.style.display='block'; setTimeout(()=>jsaved.style.display='none',2500); }
    toast('✓ Journal saved');
  } catch(e) {
    alert('Error saving journal: ' + e.message);
  }
};

// ── 4. SUPPLEMENT QUANTITY INPUT ON QUICK ADD ─────────────────
// Override quickSup to ask for quantity before saving
quickSup = async function(name) {
  const el = document.createElement('div');
  el.className = 'mbg'; el.id = '_qsmod';
  el.innerHTML = `
  <div class="mbox" style="max-height:50vh">
    <div class="mhd">
      <div class="mtitle">${name}</div>
      <button class="xbtn" onclick="document.getElementById('_qsmod').remove()">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div>
        <label class="fl">Dose / quantity</label>
        <input class="fi" id="qs-dose" placeholder="e.g. 1 scoop, 1 capsule, 500mg" value="${name==='Protein scoop'?'1 scoop 30g':name==='Omega-3'?'1 capsule 1000mg':name==='Creatine'?'5g':name==='Collagen'?'10g':'1 serving'}">
      </div>
      <div>
        <label class="fl">When</label>
        <select class="fs" id="qs-timing">
          <option>Morning</option><option>With breakfast</option>
          <option>Pre-workout</option><option>Post-workout</option>
          <option>With meals</option><option>Before bed</option><option>Any time</option>
        </select>
      </div>
    </div>
    <button class="bp" style="margin-top:14px" onclick="confirmQuickSup('${name}')">Add supplement</button>
    ${SUPMACROS[name]?.p>0?`<div style="font-size:12px;color:#4ade80;margin-top:8px;text-align:center">Adds ${SUPMACROS[name].p}g protein + ${SUPMACROS[name].cal} kcal when taken ✓</div>`:''}
    ${SUPMACROS[name]?.cal>0&&!SUPMACROS[name]?.p?`<div style="font-size:12px;color:var(--mut);margin-top:8px;text-align:center">Adds ${SUPMACROS[name].cal} kcal when taken</div>`:''}
  </div>`;
  document.body.appendChild(el);
};

async function confirmQuickSup(name) {
  const dose = (document.getElementById('qs-dose').value||'').trim();
  const timing = document.getElementById('qs-timing').value;
  document.getElementById('_qsmod').remove();
  if (!LOG.supplements) LOG.supplements = [];
  LOG.supplements.push({name, dose, timing, taken:false});
  await setLog(CU.id, today(), LOG);
  toast('✓ ' + name + ' added');
  loadMeds();
}

// ── 5. MEDICATION CHECKBOX FIX ────────────────────────────────
// togMed needs LOG to be set to today's log, not a past date
togMed = async function(i) {
  // Ensure we're working with today's log for meds
  const todayLog = await getLog(CU.id, today());
  if (!todayLog.meds || !todayLog.meds[i]) { alert('Medication not found'); return; }
  todayLog.meds[i].taken = !todayLog.meds[i].taken;
  if (todayLog.meds[i].taken) {
    todayLog.meds[i].takenAt = nowIST();
    toast('✓ ' + todayLog.meds[i].name + ' marked as taken');
  } else {
    delete todayLog.meds[i].takenAt;
    toast(todayLog.meds[i].name + ' unmarked');
  }
  LOG = todayLog;
  await setLog(CU.id, today(), todayLog);
  loadMeds();
};

// ── 6. HISTORY — show journal details ────────────────────────
// Override loadHistory to show journal mood/vitals inline
loadHistory = async function() {
  const logs = await logsN(CU.id, 30);
  const dates = Object.keys(logs).sort((a,b) => b.localeCompare(a));
  const moodLabels = ['😣 Bad','😕 Low','😐 Okay','🙂 Good','😄 Great'];
  let html = `<div style="font-family:'Syne';font-size:18px;font-weight:700;margin-bottom:14px">Last 30 days</div>`;
  let any = false;

  for (const d of dates) {
    const log = logs[d];
    if (!log.meals?.length && !log.activity?.type && !log.journal && log.mood === undefined) continue;
    any = true;
    const t = rcFull(log);
    const medsMissed = (log.meds||[]).filter(m=>!m.taken).length;
    const hasMood = log.mood !== undefined && log.mood !== null;
    const hasVitals = log.energy || log.sleep || log.stress;

    html += `<div class="hrow" onclick="viewHistDay('${d}')">
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600">${fdate(d)}</div>
        <div style="font-size:11px;color:var(--mut);margin-top:3px">${log.activity?.type||'No activity logged'}</div>
        ${hasMood || hasVitals ? `<div style="font-size:11px;color:var(--mut);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap">
          ${hasMood ? `<span>${moodLabels[log.mood]||''}</span>` : ''}
          ${log.energy ? `<span>⚡ ${log.energy}/10</span>` : ''}
          ${log.sleep ? `<span>💤 ${log.sleep}/10</span>` : ''}
          ${log.pain >= 1 ? `<span style="color:var(--red)">🔴 Pain: ${log.pain}/10</span>` : ''}
        </div>` : ''}
        ${log.journal ? `<div style="font-size:11px;color:var(--mut);font-style:italic;margin-top:3px">"${log.journal.substring(0,80)}${log.journal.length>80?'...':''}"</div>` : ''}
        ${medsMissed > 0 ? `<div style="font-size:11px;color:var(--red);margin-top:3px">💊 ${medsMissed} medication(s) missed</div>` : ''}
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:10px">
        <div style="display:flex;gap:6px;justify-content:flex-end;font-size:11px;font-family:'DM Mono'">
          <span style="color:#4ade80">P:${t.p}g</span>
          <span style="color:#fbbf24">${t.cal}kcal</span>
        </div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${log.meals?.length||0} meals</div>
        <div style="font-size:11px;color:#67e8f9;margin-top:1px">${(log.water||0).toFixed(1)}L</div>
      </div>
    </div>`;
  }

  if (!any) html += `<div class="empty">No history yet. Start logging today!</div>`;
  const pg = document.getElementById('pgc');
  if (pg) pg.innerHTML = html;
};

async function viewHistDay(d) {
  VD = d;
  showL('Loading...');
  LOG = await getLog(CU.id, d);
  hideL();
  document.querySelectorAll('.bni').forEach(b => b.classList.remove('on'));
  document.getElementById('bn0').classList.add('on');
  renderToday();
}

console.log('Fix patch v2 loaded ✓');
</script>
<script>
// ═══════════════════════════════════════════════════════════════
// VISION FIX — Use Anthropic Claude API for photo analysis
// Claude API allows image analysis from browser without CORS issues
// ═══════════════════════════════════════════════════════════════

// Override gVision to use Claude instead of Gemini for photos
gVision = async function(b64, mime) {
  // Try Claude first (better image analysis, no CORS on base64)
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': 'CLAUDE_KEY_PLACEHOLDER',
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        messages: [{
          role: 'user',
          content: [
            {type:'image', source:{type:'base64', media_type:mime, data:b64}},
            {type:'text', text:'Identify every food item visible in this image. For each item estimate the portion size and nutritional values. This may be Indian food. Return ONLY valid JSON with no other text:\n{"items":[{"name":"food name","portion":"e.g. 4 pieces","p":12,"c":72,"f":4,"cal":372,"fi":4}],"totals":{"p":0,"c":0,"f":0,"cal":0,"fi":0,"conf":"high"},"desc":"brief description of the meal"}'}
          ]
        }]
      })
    });
    const d = await r.json();
    if (d.content?.[0]?.text) {
      const result = parseJ(d.content[0].text);
      if (result) return result;
    }
