<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HealthTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0d0d0f;--surface:#13131a;--card:#1a1a24;--border:#252535;--accent:#6ee7b7;--accent2:#818cf8;--danger:#f87171;--warn:#fbbf24;--text:#f0f0f0;--muted:#6b7280;--faint:#1e1e2a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
#app{min-height:100vh;}

/* ── COMMON ── */
.field-label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.form-input{width:100%;background:var(--faint);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans';font-size:13px;padding:9px 12px;outline:none;}
.form-input:focus{border-color:var(--accent);}
.form-select{width:100%;background:var(--faint);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans';font-size:13px;padding:9px 12px;outline:none;cursor:pointer;}
.form-textarea{width:100%;background:var(--faint);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans';font-size:13px;padding:9px 12px;outline:none;resize:vertical;line-height:1.5;}
.form-textarea:focus{border-color:var(--accent);}
.btn-primary{width:100%;padding:13px;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'Syne';font-size:15px;font-weight:700;cursor:pointer;}
.btn-outline{width:100%;padding:12px;background:none;color:var(--text);border:1px solid var(--border);border-radius:10px;font-family:'DM Sans';font-size:14px;cursor:pointer;margin-top:10px;}
.btn-sm{padding:7px 14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-ghost{padding:7px 14px;background:var(--faint);color:var(--muted);border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;}
.error-box{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--danger);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px;}
.success-box{background:rgba(110,231,183,.1);border:1px solid rgba(110,231,183,.3);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px;text-align:center;}
.loading-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;}
.empty-state{text-align:center;color:var(--muted);padding:24px;font-size:13px;}
.global-loader{position:fixed;inset:0;background:rgba(13,13,15,.92);display:flex;align-items:center;justify-content:center;z-index:999;color:var(--accent);font-size:14px;}

/* ── PIN SCREEN ── */
.pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#1a1a2e,var(--bg) 60%);}
.logo-icon{font-size:48px;margin-bottom:8px;}
.logo-text{font-family:'Syne';font-size:30px;font-weight:800;color:var(--accent);}
.logo-sub{font-size:13px;color:var(--muted);margin-top:4px;margin-bottom:28px;}
.pin-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:400px;}
.pin-tabs{display:flex;gap:5px;background:var(--faint);border-radius:12px;padding:4px;margin-bottom:20px;}
.pin-tab{flex:1;padding:9px;border:none;background:none;color:var(--muted);font-family:'DM Sans';font-size:13px;font-weight:500;cursor:pointer;border-radius:9px;transition:all .2s;}
.pin-tab.on{background:var(--accent);color:#000;}
.pin-input{width:100%;background:var(--faint);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono';font-size:18px;padding:12px 14px;outline:none;margin-bottom:14px;letter-spacing:.05em;}
.pin-input:focus{border-color:var(--accent);}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:12px 0;}

/* ── PATIENT SHELL ── */
.shell{display:flex;flex-direction:column;min-height:100vh;}
.top-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.top-bar-logo{font-family:'Syne';font-size:15px;font-weight:700;color:var(--accent);}
.top-bar-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.icon-btn{background:var(--faint);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;padding:6px 10px;cursor:pointer;}
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;z-index:50;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;color:var(--muted);font-size:10px;gap:3px;border-top:2px solid transparent;}
.bnav-item.on{color:var(--accent);border-top-color:var(--accent);}
.bnav-icon{font-size:20px;}
.page-content{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%;padding-bottom:80px;}

/* ── TODAY PAGE ── */
.date-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;}
.dnav-btn{width:36px;height:36px;background:var(--faint);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dnav-btn:disabled{opacity:.25;cursor:not-allowed;}
.dnav-label{font-family:'Syne';font-size:17px;font-weight:700;min-width:120px;text-align:center;}

/* ── NUTRITION RINGS ── */
.nutrition-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.nutrition-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px;}
.rings-row{display:flex;justify-content:space-around;margin-bottom:14px;}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.ring-svg{position:relative;width:72px;height:72px;}
.ring-svg svg{position:absolute;top:0;left:0;}
.ring-center{width:72px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;}
.ring-val{font-family:'DM Mono';font-size:14px;font-weight:600;line-height:1;}
.ring-unit{font-size:9px;color:var(--muted);}
.ring-label{font-size:11px;color:var(--muted);}
.cal-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.cal-track{height:6px;background:var(--faint);border-radius:3px;overflow:hidden;}
.cal-fill{height:100%;background:linear-gradient(to right,#6ee7b7,#34d399);border-radius:3px;transition:width .4s;}

/* ── SECTION CARD ── */
.section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

/* ── MEAL CARDS ── */
.meal-item{background:var(--faint);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
.meal-item:last-child{margin-bottom:0;}
.meal-item-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.meal-item-name{font-size:14px;font-weight:600;}
.meal-item-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.meal-item-desc{font-size:12px;color:var(--muted);margin-bottom:8px;font-style:italic;line-height:1.5;}
.meal-item-photo{width:100%;border-radius:8px;max-height:180px;object-fit:cover;margin-bottom:8px;display:block;}
.meal-macros{display:flex;gap:8px;flex-wrap:wrap;}
.mmacro{font-size:11px;font-family:'DM Mono';}
.del-btn{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.2);color:var(--danger);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;flex-shrink:0;}
.ai-note{font-size:10px;color:var(--muted);margin-top:5px;}

/* ── WATER ── */
.water-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.water-btn{padding:6px 11px;background:var(--faint);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;}
.water-btn.on{background:rgba(103,232,249,.15);border-color:#67e8f9;color:#67e8f9;}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;z-index:200;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px 18px;width:100%;max-height:92vh;overflow-y:auto;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-family:'Syne';font-size:17px;font-weight:700;}
.close-btn{background:var(--faint);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.meal-type-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.mtype-btn{padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);font-size:12px;cursor:pointer;}
.mtype-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(110,231,183,.08);}
.method-row{display:flex;gap:5px;margin-bottom:14px;}
.method-btn{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-align:center;}
.method-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(110,231,183,.08);}
.photo-zone{border:2px dashed var(--border);border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;margin-bottom:10px;transition:border .2s;}
.photo-zone:hover{border-color:var(--accent);}
.analyse-btn{width:100%;padding:11px;background:rgba(129,140,248,.15);border:1px solid rgba(129,140,248,.3);color:#818cf8;border-radius:10px;font-family:'DM Sans';font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
.analyse-btn:disabled{opacity:.5;cursor:not-allowed;}
.result-wrap{background:var(--faint);border-radius:10px;padding:12px;margin-top:12px;}
.result-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.result-item-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.result-item-row:last-child{border-bottom:none;}
.result-totals{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.rtotal{font-size:12px;font-family:'DM Mono';}
.confidence-note{font-size:10px;color:var(--muted);margin-top:6px;}

/* ── JOURNAL ── */
.mood-grid{display:flex;gap:6px;margin-bottom:4px;}
.mood-opt{flex:1;padding:8px 4px;border:1px solid var(--border);border-radius:10px;background:none;color:var(--muted);font-size:11px;cursor:pointer;text-align:center;line-height:1.4;}
.mood-opt.on{border-color:var(--accent);background:rgba(110,231,183,.08);color:var(--accent);}
.slider-wrap{margin-bottom:12px;}
.slider-hdr{display:flex;justify-content:space-between;margin-bottom:4px;}
.slider-lbl{font-size:12px;color:var(--muted);}
.slider-val{font-size:12px;font-family:'DM Mono';color:var(--accent);}
input[type=range]{width:100%;accent-color:var(--accent);}

/* ── HISTORY ── */
.hist-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:8px;transition:border .2s;}
.hist-row:hover{border-color:var(--accent);}
.hist-date{font-size:14px;font-weight:600;}
.hist-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.hist-right{text-align:right;}
.hist-macros{display:flex;gap:8px;justify-content:flex-end;font-size:11px;font-family:'DM Mono';}
.hist-meals{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── DOCTOR NOTES ── */
.note-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
.note-date{font-size:11px;color:var(--muted);margin-bottom:4px;}
.note-text{font-size:13px;line-height:1.6;}

/* ── PROFILE ── */
.profile-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#6ee7b7,#818cf8);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#000;flex-shrink:0;}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pf{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.pf-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.pf-val{font-size:13px;}

/* ── DOCTOR DASHBOARD ── */
.doc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.doc-count{font-family:'Syne';font-size:20px;font-weight:700;}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.p-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:border .2s;}
.p-card:hover{border-color:var(--accent);}
.p-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.p-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6ee7b7,#818cf8);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000;flex-shrink:0;}
.p-avatar.lg{width:52px;height:52px;font-size:20px;}
.p-name{font-size:14px;font-weight:600;}
.p-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.status-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.dot-ok{background:#22c55e;color:#fff;}
.dot-warn{background:var(--danger);color:#fff;}
.p-stats{display:flex;gap:6px;margin-bottom:10px;}
.pstat{flex:1;background:var(--faint);border-radius:8px;padding:7px;text-align:center;}
.pstat-val{font-family:'DM Mono';font-size:13px;font-weight:600;}
.pstat-lbl{font-size:10px;color:var(--muted);margin-top:1px;}
.ptag{font-size:10px;padding:2px 8px;border-radius:6px;background:var(--faint);color:var(--muted);}
.ptag-warn{background:rgba(251,191,36,.1);color:var(--warn);}
.back-btn{background:none;border:none;color:var(--muted);font-family:'DM Sans';font-size:14px;cursor:pointer;padding:0 0 14px;display:flex;align-items:center;gap:4px;}
.detail-tabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap;}
.dtab{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);font-size:12px;cursor:pointer;}
.dtab.on{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
.avg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
.avg-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center;}
.avg-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
.avg-val{font-family:'DM Mono';font-size:17px;font-weight:600;}
.act-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--faint);}
.act-name{font-size:12px;width:170px;flex-shrink:0;}
.act-bar-wrap{flex:1;height:6px;background:var(--faint);border-radius:3px;overflow:hidden;}
.act-bar{height:100%;background:var(--accent);border-radius:3px;}
.act-count{font-size:11px;color:var(--muted);font-family:'DM Mono';width:40px;text-align:right;}
.log-sum-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--faint);flex-wrap:wrap;}
.ai-box{background:var(--card);border:1px solid rgba(129,140,248,.3);border-radius:14px;padding:16px;margin-bottom:14px;}
.ai-box-title{font-size:11px;color:#818cf8;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.ai-box-content{font-size:13px;color:#ccc;line-height:1.85;white-space:pre-wrap;}
.alert-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;}
.alert-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* ── MOBILE ── */
@media(max-width:600px){
  .p-grid{grid-template-columns:1fr;}
  .avg-grid{grid-template-columns:repeat(2,1fr);}
  .rings-row{gap:4px;}
}
</style>
</head>

<script>
// ── FIREBASE ──────────────────────────────────────────────────
const firebaseConfig = {

  authDomain: "healthtracker-5eee5.firebaseapp.com",

  storageBucket: "healthtracker-5eee5.firebasestorage.app",
  messagingSenderId: "723390840680",
  appId: "1:723390840680:web:866a0eb6ab042b8ba2e0dd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const GEMINI_KEY = "AIzaSyCchzyOkA4QkAkB9r04g-VZgtTDJIcq9t0";
const DOCTOR_PIN = "1234"; // Change this

// ── STATE ─────────────────────────────────────────────────────
let CU = null; // current user
let _log = {}; // current day log
let _jlog = {}; // journal log
let _meal = {}; // pending meal
let _tab = 'today'; // active patient tab
let _dtab = 'nutrition'; // active doctor detail tab

// ── DATE HELPERS (IST-aware) ──────────────────────────────────
function getISTDate() {
  // Returns today's date string in IST (UTC+5:30)
  const now = new Date();
  const ist = new Date(now.getTime() + (5.5 * 60 * 60 * 1000));
  return ist.toISOString().split('T')[0];
}

function addDays(dateStr, n) {
  // Safe date arithmetic — avoids timezone bugs
  const parts = dateStr.split('-');
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function formatDate(dateStr) {
  const today = getISTDate();
  const yesterday = addDays(today, -1);
  if (dateStr === today) return 'Today';
  if (dateStr === yesterday) return 'Yesterday';
  const parts = dateStr.split('-');
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  return d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
}

let _viewDate = getISTDate(); // date currently being viewed

// ── UTILS ─────────────────────────────────────────────────────
function showLoader(msg) {
  let el = document.getElementById('gl');
  if (!el) { el = document.createElement('div'); el.id='gl'; el.className='global-loader'; document.body.appendChild(el); }
  el.textContent = msg || 'Loading...'; el.style.display='flex';
}
function hideLoader() { const el=document.getElementById('gl'); if(el) el.remove(); }
function closeModal() { const el=document.getElementById('modal'); if(el) el.remove(); }
function logout() { CU=null; _viewDate=getISTDate(); showPin(); }

function recalc(meals) {
  const t={protein:0,carbs:0,fat:0,calories:0,fibre:0};
  (meals||[]).forEach(m=>{
    if(m.nutrition){t.protein+=m.nutrition.protein||0;t.carbs+=m.nutrition.carbs||0;t.fat+=m.nutrition.fat||0;t.calories+=m.nutrition.calories||0;t.fibre+=m.nutrition.fibre||0;}
  });
  return {protein:Math.round(t.protein),carbs:Math.round(t.carbs),fat:Math.round(t.fat),calories:Math.round(t.calories),fibre:Math.round(t.fibre)};
}

function ring(val, max, color, label) {
  const pct = Math.min(100, val/max*100);
  const r=28, c=2*Math.PI*r, dash=c*pct/100;
  return `<div class="ring-wrap">
    <div class="ring-svg">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="${r}" fill="none" stroke="#1e1e2a" stroke-width="6"/>
        <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="6"
          stroke-dasharray="${dash} ${c}" stroke-dashoffset="${c/4}" stroke-linecap="round"/>

// ── FIREBASE OPS ──────────────────────────────────────────────
async function getPatient(pid) {
  const d = await db.collection('patients').doc(pid).get();
  return d.exists ? {id:pid,...d.data()} : null;
}
async function savePatient(pid, data) {
  await db.collection('patients').doc(pid).set(data, {merge:true});
}
async function getDayLog(pid, date) {
  const d = await db.collection('patients').doc(pid).collection('logs').doc(date).get();
  return d.exists ? d.data() : {meals:[], activity:null, water:0};
}
async function saveDayLog(pid, date, data) {
  await db.collection('patients').doc(pid).collection('logs').doc(date).set({...data, updatedAt:new Date().toISOString()}, {merge:true});
}
async function getAllPatients() {
  const s = await db.collection('patients').get();
  return s.docs.map(d=>({id:d.id,...d.data()}));
}
async function getPatientLogs(pid, days) {
  const today = getISTDate();
  const logs = {};
  const dates = [];
  for (let i=0;i<days;i++) dates.push(addDays(today,-i));
  await Promise.all(dates.map(async date=>{logs[date]=await getDayLog(pid,date);}));
  return logs;
}
async function addNote(pid, note) {
  await db.collection('patients').doc(pid).collection('doctorNotes').add({note, date:new Date().toISOString()});
}
async function getNotes(pid) {
  const s = await db.collection('patients').doc(pid).collection('doctorNotes').orderBy('date','desc').get();
  return s.docs.map(d=>d.data());
}

// ── GEMINI ────────────────────────────────────────────────────
async function gemini(prompt) {
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:800,temperature:0.35}})
  });
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'';
}

async function geminiVision(base64, mime) {
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[
      {inline_data:{mime_type:mime,data:base64}},
      {text:'Analyse this food image. Identify each food item and estimate portions. Return ONLY valid JSON:\n{"items":[{"name":"item name","portion":"estimated portion","protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0}],"totals":{"protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0,"confidence":"low|medium|high"},"description":"one line meal description"}'}
    ]}],generationConfig:{maxOutputTokens:600,temperature:0.2}})
  });
  const d = await r.json();
  try { return JSON.parse((d.candidates?.[0]?.content?.parts?.[0]?.text||'{}').replace(/```json|```/g,'').trim()); }
  catch(e) { return null; }
}

async function geminiText(text) {
  const prompt = `You are a nutritionist. Analyse this meal description and estimate nutrition values for Indian and international foods.\nMeal: "${text}"\nReturn ONLY valid JSON:\n{"items":[{"name":"item","portion":"portion size","protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0}],"totals":{"protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0,"confidence":"low|medium|high"}}`;
  const resp = await gemini(prompt);
  try { return JSON.parse(resp.replace(/```json|```/g,'').trim()); }
  catch(e) { return null; }
}

    _meal.photoMime=file.type;

    document.getElementById('photo-preview').innerHTML=`<img src="${e.target.result}" style="width:100%;border-radius:8px;max-height:220px;object-fit:cover">`;
    document.getElementById('btn-analyse-photo').style.display='block';
  };
  reader.readAsDataURL(file);
}

async function analysePhoto() {
  if(!_meal.photo64){alert('Select a photo first');return;}
  const btn=document.getElementById('btn-analyse-photo');
  btn.textContent='⏳ Analysing photo...'; btn.disabled=true;
  const result=await geminiVision(_meal.photo64, _meal.photoMime);
  btn.textContent='🤖 Analyse photo'; btn.disabled=false;
  if(!result){alert('Could not analyse. Try a clearer photo with good lighting.');return;}
  _meal.result=result;
  showNutritionResult(result);
}

function showNutritionResult(r) {
  document.getElementById('nutrition-result').style.display='block';
  const items=r.items||[];
  document.getElementById('result-items').innerHTML=items.map(it=>`
    <div class="result-item-row">
      <span>${it.name} <span style="color:var(--muted);font-size:11px">${it.portion||''}</span></span>
      <span style="font-family:'DM Mono';font-size:11px;color:var(--muted)">P:${it.protein||0}g C:${it.carbs||0}g ${it.calories||0}kcal</span>
    </div>`).join('');
  const t=r.totals||{};
  document.getElementById('result-totals').innerHTML=`
    <span class="rtotal" style="color:#4ade80">Protein: ${t.protein||0}g</span>
    <span class="rtotal" style="color:#60a5fa">Carbs: ${t.carbs||0}g</span>

  document.getElementById('result-confidence').textContent=`Confidence: ${t.confidence||'medium'} · Estimates may vary ±15%`;
  document.getElementById('btn-save-meal').style.display='block';
}

async function saveMeal() {
  const now=new Date();
  const istNow=new Date(now.getTime()+(5.5*60*60*1000));
  const time=istNow.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const meal={
    name:(document.getElementById('m-name').value||'').trim()||(_meal.type||'Meal'),
    mealType:_meal.type||'',
    time, description:_meal.desc||'',
    nutrition:_meal.result?.totals||{protein:0,carbs:0,fat:0,calories:0,fibre:0},
    nutritionItems:_meal.result?.items||[],
    aiConfidence:_meal.result?.totals?.confidence||'',
    photoUrl:_meal.photo64?`data:${_meal.photoMime};base64,${_meal.photo64}`:null,
    addedAt:new Date().toISOString()
  };
  if(!_log.meals) _log.meals=[];
  _log.meals.push(meal);
  await saveDayLog(CU.id, _viewDate, _log);
  closeModal();
  renderTodayPage();
}

async function loadAllPatients() {

  for(const patient of patients){

    const logs=await getPatientLogs(patient.id,days);
    const logged=Object.values(logs).filter(l=>l.meals?.length||l.activity||l.journal).length;
    const avgP=logged?Math.round(Object.values(logs).reduce((s,l)=>s+recalc(l.meals||[]).protein,0)/logged):0;
    const last=Object.entries(logs).filter(([,l])=>l.meals?.length||l.activity).sort((a,b)=>b[0].localeCompare(a[0]))[0];
    const lastActive=last?formatDate(last[0]):'Never';
    const todayLogged=!!(logs[today]?.meals?.length||logs[today]?.activity);
    html+=`<div class="p-card" onclick="viewPatient('${patient.id}')">
      <div class="p-card-hdr">
        <div class="p-avatar">${patient.name?.[0]||'?'}</div>

      </div>
      <div class="p-stats">
        <div class="pstat"><div class="pstat-val">${logged}/${days}</div><div class="pstat-lbl">days logged</div></div>
        <div class="pstat"><div class="pstat-val" style="color:#4ade80">${avgP}g</div><div class="pstat-lbl">avg protein</div></div>
        <div class="pstat"><div class="pstat-val">${lastActive}</div><div class="pstat-lbl">last active</div></div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">

        ${patient.conditions?`<span class="ptag ptag-warn">⚕ ${patient.conditions}</span>`:''}
      </div>
    </div>`;
  }
  html+=`</div>`;
  const m=document.getElementById('doc-main');if(m)m.innerHTML=html;
}

function ac(label,val,target,unit,color){
  return `<div class="avg-card"><div class="avg-lbl">${label}</div><div class="avg-val" style="color:${color}">${val}</div>${target?`<div style="font-size:10px;color:var(--muted)">Target: ${target}${unit}</div>`:''}</div>`;

async function genAI(pid) {
  const box=document.getElementById('ai-box'),content=document.getElementById('ai-content');
  box.style.display='block';content.textContent='Generating AI summary...';
  box.scrollIntoView({behavior:'smooth'});
  const {patient,logs,loggedDates,avg}=window._pd;
  const recentStr=loggedDates.slice(0,7).map(d=>{
    const l=logs[d],t=recalc(l.meals||[]);
    const meals=(l.meals||[]).map(m=>m.name).join(', ');
    return `${formatDate(d)}: activity=${l.activity?.type||'none'} protein=${t.protein}g cal=${t.calories} energy=${l.energy||'?'}/10 sleep=${l.sleep||'?'}/10 meals=[${meals}] notes="${(l.journal||'').substring(0,80)}"`;
  }).join('\n');
  const prompt=`You are a healthcare professional reviewing patient health tracking data.\n\nPatient: ${patient.name}, ${patient.age||'?'} years, ${patient.gender||''}\nDiet: ${patient.dietStyle||'?'} | Goal: ${patient.goal||'?'}\nConditions: ${patient.conditions||'None'} | Allergies: ${patient.allergies||'None'}\nTargets: Protein ${patient.targets?.protein||100}g/day, Calories ${patient.targets?.calories||2000}/day\n\n30-day averages (${loggedDates.length} days logged):\nProtein: ${avg.protein}g | Calories: ${avg.calories} | Carbs: ${avg.carbs}g | Fat: ${avg.fat}g | Fibre: ${avg.fibre}g | Water: ${avg.water}L | Energy: ${avg.energy}/10 | Sleep: ${avg.sleep}/10\n\nRecent 7 days:\n${recentStr}\n\nProvide a concise clinical summary:\nOVERALL STATUS: (Good / Needs attention / Concerning)\nNUTRITION ANALYSIS:\nACTIVITY PATTERN:\nAREAS OF CONCERN:\nRECOMMENDATIONS: (3 specific, actionable steps)\n\nUnder 250 words. Professional tone.`;
  const result=await gemini(prompt);
  content.style.whiteSpace='pre-wrap';content.textContent=result;
}

  await addNote(pid,note);
  document.getElementById('new-note').value='';
  alert('Note sent to patient!');
  await viewPatient(pid);
  dTab('notes',document.querySelectorAll('.dtab')[3]);
}

async function saveTargets(pid) {
  const targets={protein:parseInt(document.getElementById('tgt-p').value)||100,calories:parseInt(document.getElementById('tgt-c').value)||2000,activityDays:parseInt(document.getElementById('tgt-a').value)||4};
  await savePatient(pid,{targets});
  window._pd.patient.targets=targets;
  document.getElementById('tgt-saved').style.display='block';
}

async function loadAlerts() {
  const patients=await getAllPatients();
  const today=getISTDate();
  const alerts=[];
  for(const p of patients){
    const logs=await getPatientLogs(p.id,7);
    const todayLogged=!!(logs[today]?.meals?.length||logs[today]?.activity);
    const unlogged=Object.values(logs).filter(l=>!l.meals?.length&&!l.activity&&!l.journal).length;
    const avgP=Object.values(logs).reduce((s,l)=>s+recalc(l.meals||[]).protein,0)/7;
    const sedentary=Object.values(logs).filter(l=>l.activity?.type==='Sedentary / desk day').length;
    if(!todayLogged) alerts.push({pid:p.id,name:p.name,icon:'📵',msg:'Has not logged today',bg:'rgba(248,113,113,.15)'});
    if(unlogged>=3) alerts.push({pid:p.id,name:p.name,icon:'💤',msg:`${unlogged}/7 days without logging`,bg:'rgba(251,146,60,.15)'});
    if(avgP<(p.targets?.protein||100)*0.7) alerts.push({pid:p.id,name:p.name,icon:'🥗',msg:`Avg protein ${Math.round(avgP)}g — below target`,bg:'rgba(251,191,36,.15)'});
    if(sedentary>=4) alerts.push({pid:p.id,name:p.name,icon:'🪑',msg:`${sedentary} sedentary days this week`,bg:'rgba(99,102,241,.15)'});
  }
  const m=document.getElementById('doc-main');if(!m)return;
  m.innerHTML=`
  <button class="back-btn" onclick="loadAllPatients()">← All patients</button>
  <div style="font-family:'Syne';font-size:18px;font-weight:700;margin-bottom:14px">${alerts.length} alerts</div>
  ${alerts.length===0?'<div class="empty-state">✓ All patients on track. No alerts.</div>':''}
  ${alerts.map(a=>`<div class="alert-row" onclick="viewPatient('${a.pid}')">
    <div class="alert-icon" style="background:${a.bg}">${a.icon}</div>
    <div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--muted);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">${a.msg}</div></div>
  </div>`).join('')}`;
}

// ── INIT ─────────────────────────────────────────────────────
showPin();
</script>
