// ── GEMINI ────────────────────────────────────────────────────
async function callGemini(prompt) {
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:{maxOutputTokens:800,temperature:0.4}})
  });
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function analysePhoto(base64, mimeType) {
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:[
      {inline_data:{mime_type:mimeType,data:base64}},
      {text:'Analyse this food image. List each food item you can see with estimated portion size. Then provide total nutritional estimates. Respond in this exact JSON format only, no other text:\n{"items":[{"name":"dal","portion":"1 bowl (200ml)","protein":9,"carbs":20,"fat":1,"calories":122,"fibre":4}],"totals":{"protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0,"confidence":"medium"},"description":"Brief description of the meal"}'}
    ]}]})
  });
  const d = await r.json();
  const text = d.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  try {
    const clean = text.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  } catch(e) { return null; }
}

async function extractNutritionFromText(text) {
  const prompt = `Analyse this meal description and estimate nutritional content. Be specific about Indian foods if mentioned.
Meal: "${text}"
Respond in this exact JSON format only, no other text:
{"items":[{"name":"item name","portion":"estimated portion","protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0}],"totals":{"protein":0,"carbs":0,"fat":0,"calories":0,"fibre":0},"confidence":"low|medium|high"}`;
  const resp = await callGemini(prompt);
  try {
    const clean = resp.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  } catch(e) { return null; }
}

// ── FIREBASE OPERATIONS ───────────────────────────────────────
async function getPatient(pid) {
  const d = await getDoc(doc(db,'patients',pid));
  return d.exists() ? {id:pid,...d.data()} : null;
}

async function savePatient(pid, data) {
  await setDoc(doc(db,'patients',pid), data, {merge:true});
}

async function getDayLog(pid, date) {
  const d = await getDoc(doc(db,'patients',pid,'logs',date));
  return d.exists() ? d.data() : {meals:[],activity:null,journal:'',mood:null,energy:5,sleep:7,totals:{protein:0,carbs:0,fat:0,calories:0,fibre:0}};
}

async function saveDayLog(pid, date, data) {
  await setDoc(doc(db,'patients',pid,'logs',date), {...data, updatedAt: new Date().toISOString()}, {merge:true});
}

async function getAllPatients() {
  const snap = await getDocs(collection(db,'patients'));
  return snap.docs.map(d => ({id:d.id,...d.data()}));
}

async function getPatientLogs(pid, days=7) {
  const dates = [];
  for(let i=0;i<days;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    dates.push(d.toISOString().split('T')[0]);
  }
  const logs = {};
  await Promise.all(dates.map(async date => {
    const l = await getDayLog(pid, date);
    logs[date] = l;
  }));
  return logs;
}

async function saveDoctorNote(pid, note) {
  await addDoc(collection(db,'patients',pid,'doctorNotes'), {
    note, date: new Date().toISOString(), doctorId: 'doctor'
  });
}

async function getDoctorNotes(pid) {
  const snap = await getDocs(query(collection(db,'patients',pid,'doctorNotes'), orderBy('date','desc')));
  return snap.docs.map(d => d.data());
}

// ── RECALCULATE TOTALS ────────────────────────────────────────
function recalcTotals(meals) {
  const t = {protein:0,carbs:0,fat:0,calories:0,fibre:0};
  meals.forEach(m => {
    if(m.nutrition) {
      t.protein += m.nutrition.protein||0;
      t.carbs += m.nutrition.carbs||0;
      t.fat += m.nutrition.fat||0;
      t.calories += m.nutrition.calories||0;
      t.fibre += m.nutrition.fibre||0;
    }
  });
  return {protein:Math.round(t.protein),carbs:Math.round(t.carbs),fat:Math.round(t.fat),calories:Math.round(t.calories),fibre:Math.round(t.fibre)};
}

// ── RENDER HELPERS ────────────────────────────────────────────
function macroRing(label, val, max, color) {
  const pct = Math.min(100, Math.round(val/max*100));
  const r=28, circ=2*Math.PI*r;
  const dash = circ * pct/100;
  return `<div class="macro-ring">
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="${r}" fill="none" stroke="#1e1e1e" stroke-width="6"/>
      <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="6"
        stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round"/>
    </svg>
    <div class="ring-center">
      <div class="ring-val" style="color:${color}">${val}</div>
      <div class="ring-unit">g</div>
    </div>
    <div class="ring-label">${label}</div>
  </div>`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((today - d)/864e5);
  if(diff===0) return 'Today';
  if(diff===1) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}

async function createPatient() {
  const id = document.getElementById('np-id').value.trim().toUpperCase();
  const name = document.getElementById('np-name').value.trim();
  if(!id||!name){
    document.getElementById('create-error').textContent='Patient ID and name are required';
    document.getElementById('create-error').style.display='block';
    return;
  }
  showLoading('Creating profile...');
  const existing = await getPatient(id);
  if(existing){
    hideLoading();
    document.getElementById('create-error').textContent='Patient ID already exists. Choose a different one.';
    document.getElementById('create-error').style.display='block';
    return;
  }
  const profile = {
    name, age: document.getElementById('np-age').value||'',
    gender: document.getElementById('np-gender').value,
    height: document.getElementById('np-height').value||'',
    weight: document.getElementById('np-weight').value||'',
    dietStyle: document.getElementById('np-diet').value,
    conditions: document.getElementById('np-conditions').value||'',
    allergies: document.getElementById('np-allergies').value||'',
    goal: document.getElementById('np-goal').value,
    createdAt: new Date().toISOString(),
    targets: {protein:100, calories:2000, activityDays:4, water:2.5}
  };
  await savePatient(id, profile);
  currentUser = {type:'patient', id, profile:{id,...profile}};
  hideLoading();
  showPatientApp();
}

async function handlePhotoSelect(input) {

  const reader = new FileReader();
  reader.onload = function(e) {

    window._pendingPhotoBase64 = base64;

    document.getElementById('photo-preview-wrap').innerHTML = `<img src="${e.target.result}" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover">`;
    document.getElementById('photo-analyse-btn').style.display='block';

async function saveMeal() {
  const name = document.getElementById('meal-name-input').value.trim() || (window._selectedMealType||'Meal');
  const now = new Date();
  const time = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const meal = {
    name, mealType: window._selectedMealType||'',
    time, description: document.getElementById('meal-text-input')?.value?.trim()||'',
    nutrition: window._pendingMealData?.totals||{protein:0,carbs:0,fat:0,calories:0,fibre:0},
    nutritionItems: window._pendingMealData?.items||[],
    aiConfidence: window._pendingMealData?.totals?.confidence||'',
    photoUrl: window._pendingPhotoBase64 ? `data:${window._pendingPhotoMime};base64,${window._pendingPhotoBase64}` : null,
    addedAt: new Date().toISOString()
  };
  const log = window._currentLog || {meals:[]};
  if(!log.meals) log.meals = [];
  log.meals.push(meal);
  log.totals = recalcTotals(log.meals);
  await saveDayLog(currentUser.id, currentLogDay, log);

  const avgData = {protein:0,carbs:0,fat:0,calories:0,fibre:0,water:0,energy:0,sleep:0};

  const sedentaryDays = (activityCounts['Sedentary / desk day']||0)+(loggedDates.length-loggedDates.filter(d=>logs[d].activity?.type&&logs[d].activity.type!=='Sedentary / desk day'&&logs[d].activity.type!=='Rest / recovery').length);

      <div id="ai-summary-content" class="ai-summary-content">Generating...</div>
    </div>

    <div class="detail-tabs">
      <button class="detail-tab on" onclick="detailTab('nutrition',this)">Nutrition</button>
      <button class="detail-tab" onclick="detailTab('activity',this)">Activity</button>
      <button class="detail-tab" onclick="detailTab('logs',this)">Daily logs</button>
      <button class="detail-tab" onclick="detailTab('notes',this)">Notes</button>
    </div>

    <div id="detail-nutrition" class="detail-panel">
      <div class="avg-title">30-day averages (${loggedDates.length} days logged)</div>
      <div class="avg-grid">
        ${avgCard('Avg protein',avgData.protein+'g', patient.targets?.protein, 'g','#4ade80')}
        ${avgCard('Avg calories',avgData.calories+' kcal', patient.targets?.calories, ' kcal','#fbbf24')}
        ${avgCard('Avg carbs',avgData.carbs+'g',null,null,'#60a5fa')}
        ${avgCard('Avg fat',avgData.fat+'g',null,null,'#f472b6')}
        ${avgCard('Avg fibre',avgData.fibre+'g',null,null,'#fb923c')}
        ${avgCard('Avg water',avgData.water+'L', patient.targets?.water,'L','#67e8f9')}
        ${avgCard('Avg energy',avgData.energy+'/10',null,null,'#a78bfa')}
        ${avgCard('Avg sleep',avgData.sleep+'h',null,null,'#818cf8')}
      </div>
    </div>

          </div>

        <button class="pin-btn" style="margin-top:8px" onclick="addDoctorNote('${pid}')">Send note to patient</button>
      </div>
      <div class="notes-history">
        ${notes.map(n=>`<div class="doctor-note-card">
          <div class="note-date">${new Date(n.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          <div class="note-text">${n.note}</div>
        </div>`).join('')}
        ${notes.length===0?'<div class="empty-state">No notes yet</div>':''}
      </div>
    </div>
    <div style="height:40px"></div>
  </div>`;

  window._patientDetailData = {patient, logs, loggedDates, avgData};
}

function detailTab(tab, el) {
  document.querySelectorAll('.detail-tab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.detail-panel').forEach(p=>p.style.display='none');
  document.getElementById('detail-'+tab).style.display='block';
}

function avgCard(label, val, target, unit, color) {
  const targetLine = target ? `<div style="font-size:10px;color:var(--muted)">Target: ${target}${unit}</div>` : '';
  return `<div class="avg-card">
    <div class="avg-label">${label}</div>
    <div class="avg-val" style="color:${color}">${val}</div>
    ${targetLine}
  </div>`;
}

async function generateAISummary(pid) {
  const box = document.getElementById('ai-summary-box');
  const content = document.getElementById('ai-summary-content');
  box.style.display='block';
  content.textContent='Generating AI summary...';
  box.scrollIntoView({behavior:'smooth'});

  const {patient, logs, loggedDates, avgData} = window._patientDetailData;
  const recentJournals = loggedDates.slice(0,7).map(d=>{
    const l=logs[d];
    const t=recalcTotals(l.meals||[]);
    return `${formatDate(d)}: activity=${l.activity?.type||'none'} protein=${t.protein}g calories=${t.calories}kcal energy=${l.energy||'?'}/10 sleep=${l.sleep||'?'}h mood=${l.mood!==undefined?['Bad','Low','Okay','Good','Great'][l.mood]:'?'} journal="${(l.journal||'').substring(0,100)}"`;
  }).join('\n');

  const prompt = `You are a healthcare professional reviewing a patient's health tracking data.

Patient: ${patient.name}, ${patient.age} years old, ${patient.gender}
Diet: ${patient.dietStyle} | Goal: ${patient.goal}
Medical conditions: ${patient.conditions||'None'} | Allergies: ${patient.allergies||'None'}
Doctor's targets: Protein ${patient.targets?.protein}g/day, Calories ${patient.targets?.calories}kcal/day

30-day averages:
- Protein: ${avgData.protein}g/day (target: ${patient.targets?.protein}g)
- Calories: ${avgData.calories}kcal/day (target: ${patient.targets?.calories})
- Carbs: ${avgData.carbs}g, Fat: ${avgData.fat}g, Fibre: ${avgData.fibre}g
- Water: ${avgData.water}L/day, Energy: ${avgData.energy}/10, Sleep: ${avgData.sleep}h

Recent 7 days detail:
${recentJournals}

Provide a clinical summary with:
OVERALL STATUS: (Good/Concerning/Needs attention)
NUTRITION ANALYSIS: Key findings on their diet
ACTIVITY PATTERN: Assessment of their activity
AREAS OF CONCERN: Specific issues to address
RECOMMENDATIONS: 3 specific, actionable recommendations for this patient
Keep it professional and concise (under 300 words).`;

  const result = await callGemini(prompt);
  content.style.whiteSpace='pre-wrap';
  content.textContent = result;
}

async function addDoctorNote(pid) {
  const note = document.getElementById('new-note-text').value.trim();
  if(!note) return;
  await saveDoctorNote(pid, note);
  document.getElementById('new-note-text').value='';
  await viewPatient(pid);
  detailTab('notes', document.querySelector('.detail-tab:last-child'));
}

async function loadAlerts() {
  const patients = await getAllPatients();
  const alerts = [];
  for(const p of patients) {
    const logs = await getPatientLogs(p.id, 7);
    const loggedToday = !!(logs[currentDate]?.meals?.length||logs[currentDate]?.activity);
    const daysNotLogged = Object.values(logs).filter(l=>!l.meals?.length&&!l.activity&&!l.journal).length;
    const avgProtein = Object.values(logs).reduce((s,l)=>s+recalcTotals(l.meals||[]).protein,0) / 7;
    const sedentary = Object.values(logs).filter(l=>l.activity?.type==='Sedentary / desk day').length;
    if(!loggedToday) alerts.push({pid:p.id, name:p.name, type:'not-logged', msg:'Has not logged today'});
    if(daysNotLogged>=3) alerts.push({pid:p.id, name:p.name, type:'inactive', msg:`${daysNotLogged} days without logging this week`});
    if(avgProtein < (p.targets?.protein||100)*0.7) alerts.push({pid:p.id, name:p.name, type:'nutrition', msg:`Avg protein ${Math.round(avgProtein)}g/day — below target`});
    if(sedentary>=4) alerts.push({pid:p.id, name:p.name, type:'sedentary', msg:`${sedentary} sedentary days this week`});
  }
  document.getElementById('doctor-main').innerHTML = `
  <div class="alerts-page">
    <div class="patients-header">
      <div class="patients-count">${alerts.length} alerts</div>
    </div>
    ${alerts.length===0?'<div class="empty-state" style="margin-top:40px">All patients are on track. No alerts.</div>':''}
    ${alerts.map(a=>`
      <div class="alert-row" onclick="viewPatient('${a.pid}')">
        <div class="alert-icon ${a.type==='not-logged'?'alert-red':a.type==='nutrition'?'alert-amber':'alert-orange'}">
          ${a.type==='not-logged'?'📵':a.type==='inactive'?'💤':a.type==='nutrition'?'🥗':'🪑'}
        </div>
        <div>
          <div class="alert-patient">${a.name} <span style="color:var(--muted);font-size:11px">${a.pid}</span></div>
          <div class="alert-msg">${a.msg}</div>
        </div>
      </div>`).join('')}
  </div>`;
}

function showAddPatientDoctor() { showCreatePatient(); }

function closeModal(id) { document.getElementById(id)?.remove(); }
function logout() { currentUser=null; showPinScreen(); }
function showLoading(msg) {
  let el = document.getElementById('global-loader');
  if(!el){el=document.createElement('div');el.id='global-loader';el.className='global-loader';document.body.appendChild(el);}
  el.textContent=msg||'Loading...';el.style.display='flex';
}
function hideLoading() { document.getElementById('global-loader')?.remove(); }

// ── INIT ─────────────────────────────────────────────────────
showPinScreen();
</script>
