.dtabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap;}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px;}

.aicon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

@media(max-width:600px){.pgrd{grid-template-columns:1fr;}.agrid{grid-template-columns:repeat(2,1fr);}}

// ── STATE ─────────────────────────────────────────────────────
let CU=null, _log={}, _jlog={}, _meal={}, _vd='';

// ── DATE (IST) ────────────────────────────────────────────────
function istDate() {
  const now = new Date();
  // Get UTC ms + 5h30m
  const istMs = now.getTime() + (330 * 60 * 1000);
  const istDate = new Date(istMs);
  const y = istDate.getUTCFullYear();
  const m = String(istDate.getUTCMonth()+1).padStart(2,'0');
  const d = String(istDate.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function shiftDate(ds, n) {
  // Pure arithmetic, no timezone
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return [
    dt.getFullYear(),
    String(dt.getMonth()+1).padStart(2,'0'),
    String(dt.getDate()).padStart(2,'0')
  ].join('-');
}

function fmtDate(ds) {
  const today = istDate();
  if (ds === today) return 'Today';
  if (ds === shiftDate(today,-1)) return 'Yesterday';
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}

function nowTime() {
  const now = new Date();
  const ist = new Date(now.getTime() + 330*60*1000);
  return ist.toISOString().substr(11,5).replace(':',':'); // HH:MM
}

// ── HELPERS ───────────────────────────────────────────────────
function showL(msg){let e=document.getElementById('_gl');if(!e){e=document.createElement('div');e.id='_gl';e.className='loader';document.body.appendChild(e);}e.textContent=msg||'Loading...';e.style.display='flex';}
function hideL(){const e=document.getElementById('_gl');if(e)e.remove();}
function closeModal(){const e=document.getElementById('_modal');if(e)e.remove();}
function logout(){CU=null;showPin();}

function recalc(meals){
  const t={p:0,c:0,f:0,cal:0,fi:0};
  (meals||[]).forEach(m=>{if(m.n){t.p+=m.n.p||0;t.c+=m.n.c||0;t.f+=m.n.f||0;t.cal+=m.n.cal||0;t.fi+=m.n.fi||0;}});
  return {p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f),cal:Math.round(t.cal),fi:Math.round(t.fi)};
}

function ring(val,max,color,label){
  const pct=Math.min(100,val/max*100);
  const r=28,circ=2*Math.PI*r,dash=circ*pct/100;
  return `<div class="ringw">
    <div class="ringsvg">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="${r}" fill="none" stroke="#1e1e2a" stroke-width="6"/>
        <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="6"
          stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round"/>
      </svg>
      <div class="ringctr"><div class="rval" style="color:${color}">${val}</div><div class="runit">g</div></div>
    </div>
    <div class="rlbl">${label}</div>
  </div>`;
}

// ── FIREBASE ──────────────────────────────────────────────────
async function getP(pid){const d=await db.collection('patients').doc(pid).get();return d.exists?{id:pid,...d.data()}:null;}
async function saveP(pid,data){await db.collection('patients').doc(pid).set(data,{merge:true});}
async function getLog(pid,date){const d=await db.collection('patients').doc(pid).collection('logs').doc(date).get();return d.exists?d.data():{meals:[],activity:null,water:0};}
async function saveLog(pid,date,data){await db.collection('patients').doc(pid).collection('logs').doc(date).set({...data,updatedAt:new Date().toISOString()},{merge:true});}
async function allPatients(){const s=await db.collection('patients').get();return s.docs.map(d=>({id:d.id,...d.data()}));}
async function patientLogs(pid,days){
  const today=istDate(),logs={};
  const dates=[];for(let i=0;i<days;i++)dates.push(shiftDate(today,-i));
  await Promise.all(dates.map(async date=>{logs[date]=await getLog(pid,date);}));
  return logs;
}
async function addNote(pid,note){await db.collection('patients').doc(pid).collection('doctorNotes').add({note,date:new Date().toISOString()});}
async function getNotes(pid){const s=await db.collection('patients').doc(pid).collection('doctorNotes').orderBy('date','desc').get();return s.docs.map(d=>d.data());}

// ── GEMINI ────────────────────────────────────────────────────
async function callGemini(prompt){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:800,temperature:0.3}})
  });
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'';
}

async function callGeminiVision(b64,mime){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[
      {inline_data:{mime_type:mime,data:b64}},
      {text:'Identify every food item in this image with estimated portion sizes. Return ONLY valid JSON:\n{"items":[{"name":"food name","portion":"e.g. 1 bowl 200ml","p":9,"c":20,"f":3,"cal":143,"fi":4}],"totals":{"p":0,"c":0,"f":0,"cal":0,"fi":0,"conf":"low|medium|high"},"desc":"one line description"}'}
    ]}],generationConfig:{maxOutputTokens:600,temperature:0.2}})
  });
  const d=await r.json();
  try{return JSON.parse((d.candidates?.[0]?.content?.parts?.[0]?.text||'{}').replace(/```json|```/g,'').trim());}
  catch(e){return null;}
}

async function analyseText(text){
  const prompt=`You are an expert nutritionist specialising in Indian and international foods.
Analyse this meal and return accurate nutritional values.

INDIAN FOOD REFERENCE VALUES (use as baseline):
Poha 1 plate(150g): p=4,c=32,f=4,cal=177,fi=2
Upma 1 plate(150g): p=4,c=28,f=5,cal=172,fi=2
Idli 1pc(50g): p=2,c=12,f=0.4,cal=58,fi=0.5
Dosa 1pc: p=3,c=25,f=2,cal=130,fi=1
Chapati/roti 1pc: p=3,c=18,f=1,cal=93,fi=2
Rice 1bowl(150g cooked): p=4,c=45,f=0.5,cal=200,fi=0.5
Dal tadka 1bowl(200ml): p=9,c=20,f=3,cal=143,fi=4

  document.getElementById('fp').style.display=t==='patient'?'block':'none';

  document.getElementById('perr').style.display='none';
}

function perr(msg){const e=document.getElementById('perr');if(e){e.textContent=msg;e.style.display='block';}}

async function doLoginP(){
  const id=(document.getElementById('f-pid').value||'').trim().toUpperCase();
  const pass=(document.getElementById('f-pp').value||'').trim();
  if(!id){perr('Enter your Patient ID');return;}
  if(!pass){perr('Enter your password');return;}
  showL('Verifying...');
  try{
    const p=await getP(id);
    hideL();
    if(!p){perr('Patient ID not found. Create a new profile below.');return;}
    const hash=btoa(id+':'+pass+':ht2026');
    if(p.passHash&&p.passHash!==hash){perr('Incorrect password. Try again.');return;}
    if(!p.passHash){await saveP(id,{passHash:hash});}
    CU={type:'patient',id,profile:p};
    _vd=istDate();
    showPatApp();
  }catch(e){hideL();perr('Error: '+e.message);}
}

async function doLoginD(){
  const pin=(document.getElementById('f-dp').value||'').trim();
  if(pin!==DOCPIN){perr('Incorrect PIN');return;}
  showL('Loading dashboard...');
  CU={type:'doctor'};
  await showDocApp();
}

async function doCreateP(){
  const id=(document.getElementById('np-id').value||'').trim().toUpperCase();
  const pass=(document.getElementById('np-pass').value||'').trim();
  const name=(document.getElementById('np-name').value||'').trim();
  const e=document.getElementById('cerr');
  if(!id||!name){e.textContent='Patient ID and name are required';e.style.display='block';return;}
  if(!pass||pass.length<4){e.textContent='Password must be at least 4 characters';e.style.display='block';return;}
  showL('Creating profile...');
  try{
    const existing=await getP(id);
    if(existing){hideL();e.textContent='Patient ID already exists. Choose another.';e.style.display='block';return;}
    const hash=btoa(id+':'+pass+':ht2026');
    const profile={
      name,passHash:hash,
      age:document.getElementById('np-age').value||'',
      gender:document.getElementById('np-gender').value,
      height:document.getElementById('np-h').value||'',
      weight:document.getElementById('np-w').value||'',
      dietStyle:document.getElementById('np-diet').value,
      conditions:document.getElementById('np-cond').value||'',
      allergies:document.getElementById('np-allergy').value||'',
      goal:document.getElementById('np-goal').value,
      createdAt:new Date().toISOString(),
      targets:{protein:100,calories:2000,activityDays:4}
    };
    await saveP(id,profile);
    CU={type:'patient',id,profile:{id,...profile}};
    _vd=istDate();
    hideL();
    showPatApp();
  }catch(err){hideL();e.textContent='Error: '+err.message;e.style.display='block';}
}

    <div class="stitle" style="margin-bottom:10px">Water intake</div>
    <div class="wgrid">

function mealCard(m,i,isToday){

async function navD(dir){
  const newDate=shiftDate(_vd,dir);
  const today=istDate();
  if(newDate>today)return; // can't go to future
  _vd=newDate;
  showL('Loading...');
  const log=await getLog(CU.id,_vd);
  _log=log;
  hideL();
  renderToday();
}

async function saveAct(){
  const type=document.getElementById('act-t').value;
  const dur=document.getElementById('act-d').value;
  if(!_log.activity)_log.activity={};
  _log.activity.type=type;_log.activity.duration=dur;
  await saveLog(CU.id,_vd,_log);
}

async function setW(val){
  _log.water=val;
  await saveLog(CU.id,_vd,_log);
  document.getElementById('wlbl').textContent=val+'L logged';
  document.querySelectorAll('.wbtn').forEach(b=>b.classList.toggle('on',parseFloat(b.textContent)<=val));
}

async function delMeal(i){
  if(!confirm('Remove this meal?'))return;
  _log.meals.splice(i,1);
  await saveLog(CU.id,_vd,_log);
  renderToday();
}

function pickMT(t,el){document.querySelectorAll('.mtbtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');_meal.type=t;}

function pickMeth(m,el){
  document.querySelectorAll('.methbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');_meal.method=m;
  document.getElementById('p-text').style.display=m==='text'?'block':'none';
  document.getElementById('p-photo').style.display=m==='photo'?'block':'none';
}

async function doAnalyseText(){
  const txt=(document.getElementById('m-txt').value||'').trim();
  if(!txt){alert('Describe your meal first');return;}
  const btn=document.getElementById('btn-atxt');
  btn.textContent='⏳ Analysing...';btn.disabled=true;
  const r=await analyseText(txt);
  btn.textContent='🤖 Analyse nutrition';btn.disabled=false;
  if(!r){alert('Could not analyse. Please be more specific about food items and quantities.');return;}
  _meal.desc=txt;_meal.result=r;
  showResult(r);
}

function handlePhoto(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    _meal.b64=e.target.result.split(',')[1];
    _meal.mime=file.type;
    _meal.photoUrl=e.target.result;
    document.getElementById('photo-prev').innerHTML=`<img src="${e.target.result}" style="width:100%;border-radius:8px;max-height:220px;object-fit:cover">`;
    document.getElementById('btn-aimg').style.display='block';
  };
  reader.readAsDataURL(file);
}

async function doAnalysePhoto(){
  if(!_meal.b64){alert('Select a photo first');return;}
  const btn=document.getElementById('btn-aimg');
  btn.textContent='⏳ Analysing photo...';btn.disabled=true;
  const r=await callGeminiVision(_meal.b64,_meal.mime);
  btn.textContent='🤖 Analyse photo';btn.disabled=false;
  if(!r){alert('Could not analyse. Try a clearer photo with good lighting.');return;}
  _meal.result=r;showResult(r);
}

function showResult(r){
  document.getElementById('nut-result').style.display='block';
  const items=r.items||[];
  document.getElementById('r-items').innerHTML=items.map(it=>
    `<div class="rrow"><span>${it.name} <span style="color:var(--muted);font-size:11px">${it.portion||''}</span></span><span style="font-family:'DM Mono';font-size:11px;color:var(--muted)">P:${it.p||0}g C:${it.c||0}g ${it.cal||0}kcal</span></div>`
  ).join('');
  const t=r.totals||{};
  document.getElementById('r-tots').innerHTML=`
    <span class="rtot" style="color:#4ade80">Protein: ${t.p||0}g</span>
    <span class="rtot" style="color:#60a5fa">Carbs: ${t.c||0}g</span>

async function genAISummary(pid){
  const box=document.getElementById('ai-box');
  const txt=document.getElementById('ai-txt');
  if(!box||!txt){alert('Please scroll up — AI summary box is above.');return;}
  box.style.display='block';
  txt.textContent='Generating AI clinical summary...';
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    const {pat,logs,ld,avg}=window._pd||{};
    if(!ld||ld.length===0){txt.textContent='No logged data yet. Need at least 1 day of data to generate a summary.';return;}
    const recent=ld.slice(0,7).map(d=>{
      const l=logs[d],t=recalc(l.meals||[]);
      const meals=(l.meals||[]).map(m=>m.name).filter(Boolean).join(', ')||'none';
      return `${fmtDate(d)}: activity=${l.activity?.type||'none'} protein=${t.p}g calories=${t.cal} energy=${l.energy||'?'}/10 sleep=${l.sleep||'?'}/10 meals=[${meals}] notes="${(l.journal||'').substring(0,80)}"`;
    }).join('\n');
    const prompt=`You are a clinical nutritionist and healthcare professional reviewing patient health data.\n\nPatient profile:\nName: ${pat.name}, Age: ${pat.age||'?'}, Gender: ${pat.gender||'?'}\nDietary style: ${pat.dietStyle||'?'}\nHealth goal: ${pat.goal||'?'}\nMedical conditions: ${pat.conditions||'None'}\nAllergies: ${pat.allergies||'None'}\nDoctor's targets: Protein ${pat.targets?.protein||100}g/day, Calories ${pat.targets?.calories||2000}/day\n\n30-day averages (${ld.length} days of data):\nProtein: ${avg.p}g/day | Calories: ${avg.cal}/day | Carbs: ${avg.c}g | Fat: ${avg.f}g | Fibre: ${avg.fi}g\nWater: ${avg.water}L/day | Energy: ${avg.energy}/10 | Sleep: ${avg.sleep}/10\n\nRecent 7 days detail:\n${recent}\n\nWrite a concise clinical summary with exactly these sections:\n\nOVERALL STATUS: [Good / Needs attention / Concerning]\n\nNUTRITION ANALYSIS:\n[Key findings about their nutrition — what they eat, what's missing]\n\nACTIVITY PATTERN:\n[Assessment of their physical activity]\n\nAREAS OF CONCERN:\n[Specific issues that need attention]\n\nRECOMMENDATIONS:\n1. [First recommendation]\n2. [Second recommendation]\n3. [Third recommendation]\n\nKeep it under 250 words. Use professional clinical language.`;
    const result=await callGemini(prompt);
    if(!result||result.trim()===''){
      txt.textContent='Gemini returned an empty response. Check that the API key is valid and has available quota.';
      return;
    }
    txt.style.whiteSpace='pre-wrap';
    txt.textContent=result;
  }catch(err){
    txt.textContent='Error: '+err.message+'\n\nThis may be a network or API key issue.';
    console.error('AI Summary error:',err);
  }
}

// ── ALERTS ────────────────────────────────────────────────────
async function loadAlerts(){
  showL('Checking patients...');
  const patients=await allPatients();
  const today=istDate();
  const critical=[],warnings=[];

  for(const pat of patients){
    const logs=await patientLogs(pat.id,7);
    // Consecutive days not logged
    let cons=0;
    for(let i=0;i<7;i++){
      const d=shiftDate(today,-i);
      if(!logs[d]?.meals?.length&&!logs[d]?.activity&&!logs[d]?.journal)cons++;
      else break;
    }
    if(cons>=3)critical.push({pid:pat.id,name:pat.name,icon:'📵',msg:`Not logged in ${cons} consecutive days`,bg:'rgba(248,113,113,.15)'});

    const loggedDays=Object.values(logs).filter(l=>l.meals?.length);
    if(loggedDays.length>=2){
      const avgP=loggedDays.reduce((s,l)=>s+recalc(l.meals||[]).p,0)/loggedDays.length;
      if(avgP<(pat.targets?.protein||100)*0.5)critical.push({pid:pat.id,name:pat.name,icon:'⚠️',msg:`Protein critically low: avg ${Math.round(avgP)}g vs ${pat.targets?.protein||100}g target`,bg:'rgba(248,113,113,.15)'});
      else if(avgP<(pat.targets?.protein||100)*0.75)warnings.push({pid:pat.id,name:pat.name,icon:'🥗',msg:`Protein below target: avg ${Math.round(avgP)}g (target ${pat.targets?.protein||100}g)`,bg:'rgba(251,191,36,.15)'});
    }
    const highPain=Object.values(logs).filter(l=>(l.pain||0)>=7);
    if(highPain.length>=2)warnings.push({pid:pat.id,name:pat.name,icon:'🔴',msg:`High pain reported (≥7/10) on ${highPain.length} days`,bg:'rgba(251,191,36,.15)'});
    const sedentary=Object.values(logs).filter(l=>l.activity?.type==='Sedentary / desk day').length;
    if(sedentary>=5)warnings.push({pid:pat.id,name:pat.name,icon:'🪑',msg:`${sedentary}/7 days sedentary`,bg:'rgba(129,140,248,.15)'});
    const lowE=Object.values(logs).filter(l=>l.energy!==undefined&&l.energy!==null&&l.energy<4);
    if(lowE.length>=3)warnings.push({pid:pat.id,name:pat.name,icon:'😔',msg:`Low energy (<4/10) on ${lowE.length} days this week`,bg:'rgba(129,140,248,.15)'});
  }

  hideL();
  const all=[...critical,...warnings];
  const pg=document.getElementById('pgc');if(!pg)return;
  pg.innerHTML=`
  <button class="backbtn" onclick="loadDocPatients()">← All patients</button>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="font-family:'Syne';font-size:18px;font-weight:700">${all.length} alerts</div>
    <div style="font-size:12px;color:var(--muted)">${critical.length} critical · ${warnings.length} warnings</div>
  </div>
  ${all.length===0?'<div class="empty" style="margin-top:40px">✅ All patients on track. No alerts this week.</div>':''}
  ${critical.length?`<div style="font-size:11px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Critical</div>`:''}
  ${critical.map(a=>`<div class="alertrow" onclick="viewPat('${a.pid}')">
    <div class="aicon" style="background:${a.bg}">${a.icon}</div>
    <div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--muted);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">${a.msg}</div></div>
  </div>`).join('')}
  ${warnings.length?`<div style="font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 8px">Warnings</div>`:''}
  ${warnings.map(a=>`<div class="alertrow" onclick="viewPat('${a.pid}')">
    <div class="aicon" style="background:${a.bg}">${a.icon}</div>
    <div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--muted);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">${a.msg}</div></div>
  </div>`).join('')}`;
}

// ── 1. DATE FIX — show actual date alongside Today/Yesterday ──
var _origFmtDate = fmtDate;
fmtDate = function(ds) {
  const today = istDate();
  const yesterday = shiftDate(today, -1);
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const actual = dt.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
  if (ds === today) return `Today · ${actual}`;
  if (ds === yesterday) return `Yesterday · ${actual}`;
  return dt.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
};

// ── 2. DATE NAV — ensure _vd is always set to today on app open ─

// ── 3. BETTER GEMINI VISION — fix photo returning 0 ──────────
callGeminiVision = async function(b64, mime) {
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{parts:[
          {inline_data:{mime_type:mime, data:b64}},
          {text:`You are a nutritionist. Look at this food image carefully and identify ALL food items visible.
For each item estimate portion size and nutritional values.
Use these Indian food baselines:
Dal chawal(dal+rice 1plate): p=13,c=65,f=3,cal=343
Poha 1plate: p=4,c=32,f=4,cal=177
Banana shake 1glass: p=8,c=38,f=5,cal=225
Chapati 1piece: p=3,c=18,f=1,cal=93
Rice 1bowl: p=4,c=45,f=0.5,cal=200
Dal 1bowl: p=9,c=20,f=3,cal=143
Egg boiled 1: p=6,c=0.5,f=5,cal=77
Paneer 100g: p=18,c=4,f=20,cal=265

Return ONLY this JSON format with no other text:
{"items":[{"name":"food item","portion":"estimated portion","p":0,"c":0,"f":0,"cal":0,"fi":0}],"totals":{"p":0,"c":0,"f":0,"cal":0,"fi":0,"conf":"medium"},"desc":"brief description"}`}
        ]}],
        generationConfig:{maxOutputTokens:800, temperature:0.1}
      })
    });
    const d = await r.json();
    if (!d.candidates || !d.candidates[0]) {
      console.error('Gemini vision no candidates:', JSON.stringify(d));
      return null;
    }
    const text = d.candidates[0].content?.parts?.[0]?.text || '';
    try {
      return JSON.parse(text.replace(/```json|```/g,'').trim());
    } catch(e) {
      const match = text.match(/\{[\s\S]*\}/);
      if (match) { try { return JSON.parse(match[0]); } catch(e2) {} }
      console.error('Gemini vision parse error:', text);
      return null;
    }
  } catch(e) {
    console.error('Gemini vision error:', e);
    return null;
  }
};

        <button class="bsm" onclick="addSupModal()">+ Add</button>
      </div>
      <div id="sups-list">
        ${sups.length===0?'<div class="empty">No supplements logged today.</div>':''}
        ${sups.map((s,i)=>`
          <div style="background:var(--faint);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:13px;font-weight:600">${s.name}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">${s.dose||''} ${s.timing?'· '+s.timing:''}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:18px;cursor:pointer" onclick="toggleSup(${i})">${s.taken?'✅':'⬜'}</span>
              <button class="delbtn" onclick="delSup(${i})">✕</button>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="sc">
      <div class="stitle" style="margin-bottom:10px">Quick add supplements</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${['Protein scoop','Multivitamin','Omega-3','Vitamin D','Vitamin B12','Calcium','Iron','Zinc','Magnesium','Creatine','Collagen'].map(s=>
          `<button onclick="quickAddSup('${s}')" style="padding:5px 12px;background:var(--faint);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:12px;cursor:pointer">${s}</button>`
        ).join('')}
      </div>
    </div>

  </div>`;
}

async function saveMed() {
  const name=(document.getElementById('med-name').value||'').trim();
  if(!name){alert('Enter medication name');return;}
  const med={name,dose:document.getElementById('med-dose').value,timing:document.getElementById('med-timing').value,notes:document.getElementById('med-notes').value,taken:false,addedAt:new Date().toISOString()};
  if(!_log.meds)_log.meds=[];
  _log.meds.push(med);
  await saveLog(CU.id,istDate(),_log);
  closeModal(); loadMedsPage();
}

async function toggleMed(i) {
  _log.meds[i].taken = !_log.meds[i].taken;
  await saveLog(CU.id,istDate(),_log);
  loadMedsPage();
}

async function delMed(i) {
  if(!confirm('Remove this medication?'))return;
  _log.meds.splice(i,1);
  await saveLog(CU.id,istDate(),_log);
  loadMedsPage();
}
