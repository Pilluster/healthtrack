// DATE — IST CORRECT
// ═══════════════════════════════════════════════════════════════
function today() {
  const ist = new Date(Date.now() + 330*60000);
  return ist.toISOString().slice(0,10);
}
function shift(ds, n) {
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(y, m-1, d); // local, no timezone
  dt.setDate(dt.getDate()+n);
  return [dt.getFullYear(), String(dt.getMonth()+1).padStart(2,'0'), String(dt.getDate()).padStart(2,'0')].join('-');
}
function fdate(ds) {
  const t=today(), y=shift(t,-1);
  const [yr,mo,dy] = ds.split('-').map(Number);
  const dt = new Date(yr,mo-1,dy);
  const actual = dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  if(ds===t) return `Today, ${actual}`;
  if(ds===y) return `Yesterday, ${actual}`;
  return dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}
function nowIST() {
  const ist = new Date(Date.now()+330*60000);
  return ist.toISOString().slice(11,16);
}

function showL(m){let e=document.getElementById('_ld');if(!e){e=document.createElement('div');e.id='_ld';e.className='ld';document.body.appendChild(e);}e.textContent=m||'Loading...';e.style.display='flex';}

function rc(meals) {
  const t={p:0,c:0,f:0,cal:0,fi:0};
  (meals||[]).forEach(m=>{if(m.n){t.p+=m.n.p||0;t.c+=m.n.c||0;t.f+=m.n.f||0;t.cal+=m.n.cal||0;t.fi+=m.n.fi||0;}});
  return {p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f),cal:Math.round(t.cal),fi:Math.round(t.fi)};
}

function ring(val,max,color,label) {
  const pct=Math.min(100,val/(max||1)*100);
  const r=28,circ=2*Math.PI*r,dash=circ*pct/100;
  return `<div class="ringw"><div class="ringsvg"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="#1e1e2a" stroke-width="6"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round"/></svg><div class="ringctr"><div class="rval" style="color:${color}">${val}</div><div class="runit">g</div></div></div><div class="rlbl">${label}</div></div>`;
}

// ═══════════════════════════════════════════════════════════════
// GEMINI — ROBUST JSON EXTRACTION
// ═══════════════════════════════════════════════════════════════
async function gCall(prompt) {
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GK}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:800,temperature:0.1}})
    });
    const d = await r.json();
    return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  } catch(e) { console.error('Gemini error:',e); return ''; }
}

async function gVision(b64, mime) {
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GK}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[
          {inline_data:{mime_type:mime,data:b64}},
          {text:`List every food item visible in this image with estimated portions and nutrition per item.
Return ONLY this JSON (no other text, no markdown):
{"items":[{"name":"food name","portion":"e.g. 1 bowl 200ml","p":9,"c":20,"f":3,"cal":143,"fi":4}],"totals":{"p":0,"c":0,"f":0,"cal":0,"fi":0,"conf":"medium"},"desc":"brief description"}`}
        ]}],
        generationConfig:{maxOutputTokens:800,temperature:0.1}
      })
    });
    const d = await r.json();
    if(!d.candidates?.[0]) { console.error('Vision no candidates:',JSON.stringify(d)); return null; }
    const text = d.candidates[0].content?.parts?.[0]?.text || '';
    return parseJSON(text);
  } catch(e) { console.error('Vision error:',e); return null; }
}

function parseJSON(text) {
  // Strip markdown code blocks
  let clean = text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // Try direct parse
  try { return JSON.parse(clean); } catch(e) {}
  // Find JSON object
  const m = clean.match(/\{[\s\S]*\}/);
  if(m) { try { return JSON.parse(m[0]); } catch(e2) {} }
  console.error('JSON parse failed for:', text.substring(0,200));
  return null;
}

function swTab(t) {
  document.getElementById('tp').classList.toggle('on',t==='p');
  document.getElementById('td').classList.toggle('on',t==='d');
  document.getElementById('fp').style.display=t==='p'?'block':'none';
  document.getElementById('fd').style.display=t==='d'?'block':'none';
  document.getElementById('perr').style.display='none';
}
function perr(m){const e=document.getElementById('perr');if(e){e.textContent=m;e.style.display='block';}}

async function doLoginP() {
  const id=(document.getElementById('pid').value||'').trim().toUpperCase();
  const pass=(document.getElementById('ppass').value||'').trim();
  if(!id){perr('Enter your Patient ID');return;}
  if(!pass){perr('Enter your password');return;}
  showL('Verifying...');
  try {
    const p=await getP(id); hideL();
    if(!p){perr('Patient ID not found. Create a new profile below.');return;}
    const hash=btoa(id+':'+pass+':ht2026');
    if(p.ph && p.ph!==hash){perr('Incorrect password.');return;}
    if(!p.ph){await setP(id,{ph:hash});} // first login sets password
    CU={type:'patient',id,profile:p};
    VD=today();
    showPat();
  } catch(e){hideL();perr('Error: '+e.message);}
}

async function doLoginD() {
  const pin=(document.getElementById('dpin').value||'').trim();
  if(pin!==DPIN){perr('Incorrect PIN');return;}
  showL('Loading...');
  CU={type:'doctor'};
  await showDoc();
}

async function doCreate() {
  const id=(document.getElementById('nid').value||'').trim().toUpperCase();
  const pass=(document.getElementById('npass').value||'').trim();
  const name=(document.getElementById('nname').value||'').trim();
  const e=document.getElementById('cerr');
  if(!id||!name){e.textContent='Patient ID and name required';e.style.display='block';return;}
  if(!pass||pass.length<4){e.textContent='Password must be at least 4 characters';e.style.display='block';return;}
  showL('Creating...');
  try {
    const ex=await getP(id);
    if(ex){hideL();e.textContent='ID already exists. Choose another.';e.style.display='block';return;}
    const profile={
      name,ph:btoa(id+':'+pass+':ht2026'),
      age:document.getElementById('nage').value||'',
      gender:document.getElementById('ngender').value,
      height:document.getElementById('nht').value||'',
      weight:document.getElementById('nwt').value||'',
      dietStyle:document.getElementById('ndiet').value,
      conditions:document.getElementById('ncond').value||'',
      allergies:document.getElementById('nallg').value||'',
      goal:document.getElementById('ngoal').value,
      createdAt:new Date().toISOString(),
      targets:{protein:100,calories:2000,activityDays:4}
    };
    await setP(id,profile);
    CU={type:'patient',id,profile:{id,...profile}};
    VD=today();
    hideL(); showPat();
  } catch(e2){hideL();document.getElementById('cerr').textContent='Error: '+e2.message;document.getElementById('cerr').style.display='block';}
}

async function navDay(d) {
  const nd=shift(VD,d); if(nd>today())return;
  VD=nd; showL('Loading...');
  LOG=await getLog(CU.id,VD); hideL();
  renderToday();
}

async function pickAct(type,el) {
  document.querySelectorAll('.actbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  const isCustom=type==='custom';
  document.getElementById('act-custom-wrap').style.display=isCustom?'block':'none';
  if(!LOG.activity)LOG.activity={};
  LOG.activity.type=isCustom?'':type;
  if(!isCustom){LOG.activity.custom='';await setLog(CU.id,VD,LOG);}
}

async function saveCustomAct() {
  const v=document.getElementById('act-custom').value.trim();
  if(!LOG.activity)LOG.activity={};
  LOG.activity.type=v; LOG.activity.custom=v;
  await setLog(CU.id,VD,LOG);
}

async function saveDur() {
  const d=document.getElementById('act-dur').value;
  if(!LOG.activity)LOG.activity={};
  LOG.activity.duration=d;
  await setLog(CU.id,VD,LOG);
}

async function saveW(ml) {
  const l=ml/1000;
  LOG.water=l;
  await setLog(CU.id,VD,LOG);
}

async function addW(v) {
  const cur=parseFloat(LOG.water)||0;
  const nw=Math.min(5,Math.round((cur+v)*10)/10);
  LOG.water=nw;
  await setLog(CU.id,VD,LOG);
  const sl=document.getElementById('wsl'); if(sl)sl.value=nw*1000;
  const wd=document.getElementById('wdisp'); if(wd)wd.textContent=nw.toFixed(1)+'L';
}

async function delM(i) {
  if(!confirm('Remove this meal?'))return;
  LOG.meals.splice(i,1);
  await setLog(CU.id,VD,LOG);
  renderToday();
}

function pickMT(t,el){document.querySelectorAll('.mtbtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');MEAL.type=t;}

function pickMeth(m,el) {
  document.querySelectorAll('.methbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('panel-text').style.display=m==='text'?'block':'none';
  document.getElementById('panel-photo').style.display=m==='photo'?'block':'none';
  document.getElementById('panel-manual').style.display=m==='manual'?'block':'none';
}

async function doText() {
  const txt=(document.getElementById('mtxt').value||'').trim();
  if(!txt){alert('Describe your meal first.');return;}
  const btn=document.getElementById('abtn-txt');
  btn.textContent='⏳ Analysing...'; btn.disabled=true;
  const r=await analyseFood(txt);
  btn.textContent='🤖 Analyse nutrition'; btn.disabled=false;
  if(!r) {
    showMResult(null, txt);
    return;
  }
  MEAL.desc=txt; MEAL.result=r;
  showMResult(r);
}

function handlePh(inp) {
  const file=inp.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    MEAL.b64=e.target.result.split(',')[1];
    MEAL.mime=file.type;
    MEAL.photoUrl=e.target.result;
    document.getElementById('ph-prev').innerHTML=`<img src="${e.target.result}" style="width:100%;border-radius:8px;max-height:220px;object-fit:cover">`;
    document.getElementById('abtn-ph').style.display='block';
  };
  reader.readAsDataURL(file);
}

async function doPhoto() {
  if(!MEAL.b64){alert('Select a photo first.');return;}
  const btn=document.getElementById('abtn-ph');
  btn.textContent='⏳ Analysing...'; btn.disabled=true;
  const r=await gVision(MEAL.b64, MEAL.mime);
  btn.textContent='🤖 Analyse photo'; btn.disabled=false;
  if(!r){
    // Show manual fallback option
    showMResult(null, 'Photo could not be analysed automatically');
    return;
  }
  MEAL.result=r;
  showMResult(r);
}

function doManual() {
  const p=parseFloat(document.getElementById('man-p').value)||0;
  const c=parseFloat(document.getElementById('man-c').value)||0;
  const f=parseFloat(document.getElementById('man-f').value)||0;
  const fi=parseFloat(document.getElementById('man-fi').value)||0;
  const port=document.getElementById('man-port').value||'';
  // Auto-calc calories if blank
  let cal=parseFloat(document.getElementById('man-cal').value);
  if(!cal) cal=Math.round(p*4+c*4+f*9);
  const name=(document.getElementById('mn').value||'').trim()||'Custom entry';
  MEAL.result={items:[{name,portion:port,p,c,f,cal,fi}],totals:{p,c,f,cal,fi,conf:'manual'}};
  showMResult(MEAL.result);
}

function showMResult(r, errMsg) {
  document.getElementById('mresult').style.display='block';
  if(!r) {
    // Analysis failed — show zero with option to switch to manual
    document.getElementById('r-items').innerHTML=`<div style="color:var(--yel);font-size:12px;padding:8px 0">${errMsg||'Analysis failed.'} Switch to "🔢 Macros" tab to enter values manually, or try describing the food differently.</div>`;
    document.getElementById('r-tots').innerHTML='';
    document.getElementById('r-conf').textContent='';
    // Still show save with zeros so they can proceed
    MEAL.result={items:[],totals:{p:0,c:0,f:0,cal:0,fi:0,conf:'unknown'}};
    document.getElementById('btn-save').style.display='block';
    return;
  }
  const items=r.items||[];
  document.getElementById('r-items').innerHTML=items.map(it=>
    `<div class="rrow"><span>${it.name} <span style="color:var(--mut);font-size:11px">${it.portion||''}</span></span><span style="font-family:'DM Mono';font-size:11px;color:var(--mut)">P:${it.p||0}g C:${it.c||0}g ${it.cal||0}kcal</span></div>`
  ).join('');
  const t=r.totals||{};
  document.getElementById('r-tots').innerHTML=`
    <span class="rtot" style="color:#4ade80">Protein: ${t.p||0}g</span>
    <span class="rtot" style="color:#60a5fa">Carbs: ${t.c||0}g</span>
    <span class="rtot" style="color:#f472b6">Fat: ${t.f||0}g</span>
    <span class="rtot" style="color:#fbbf24">${t.cal||0} kcal</span>
    ${t.fi?`<span class="rtot" style="color:#fb923c">Fibre: ${t.fi}g</span>`:''}`;
  document.getElementById('r-conf').textContent=t.conf==='manual'?'Manually entered values':`AI estimate · ${t.conf||'medium'} confidence · ±15%`;
  document.getElementById('btn-save').style.display='block';
}

async function saveM() {
  const r=MEAL.result||{};
  const t=r.totals||{};
  const meal={
    name:(document.getElementById('mn').value||'').trim()||(MEAL.type||'Meal'),
    mealType:MEAL.type||'',
    time:nowIST(),
    desc:document.getElementById('mtxt')?.value?.trim()||'',
    n:{p:t.p||0,c:t.c||0,f:t.f||0,cal:t.cal||0,fi:t.fi||0},
    items:r.items||[],
    aiConf:t.conf||'',
    photoUrl:MEAL.photoUrl||null,
    addedAt:new Date().toISOString()
  };
  if(!LOG.meals)LOG.meals=[];
  LOG.meals.push(meal);
  await setLog(CU.id,VD,LOG);
  closeMod(); renderToday();
}

async function loadHistory() {
  const logs=await logsN(CU.id,30);
  const dates=Object.keys(logs).sort((a,b)=>b.localeCompare(a));
  let html=`<div style="font-family:'Syne';font-size:18px;font-weight:700;margin-bottom:14px">Last 30 days</div>`;
  let any=false;
  for(const d of dates){
    const log=logs[d];
    if(!log.meals?.length&&!log.activity?.type&&!log.journal)continue;
    any=true;
    const t=rc(log.meals||[]);
    html+=`<div class="hrow" onclick="jumpDay('${d}')">
      <div>
        <div style="font-size:14px;font-weight:600">${fdate(d)}</div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${log.activity?.type||'No activity logged'}</div>
      </div>
      <div style="text-align:right">
        <div style="display:flex;gap:8px;justify-content:flex-end;font-size:11px;font-family:'DM Mono'">
          <span style="color:#4ade80">P:${t.p}g</span><span style="color:#fbbf24">${t.cal}kcal</span>
        </div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${log.meals?.length||0} meals · ${(log.water||0).toFixed(1)}L</div>
      </div>
    </div>`;
  }
  if(!any)html+=`<div class="empty">No history yet. Start logging today!</div>`;
  document.getElementById('pgc').innerHTML=html;
}

  document.querySelectorAll('.bni').forEach(b=>b.classList.remove('on'));
  document.getElementById('bn0').classList.add('on');

  for(const p of patients) {
    const days=parseInt(document.getElementById('rng')?.value||'7');
    const logs=await logsN(p.id,days);
    const logged=Object.values(logs).filter(l=>l.meals?.length||l.activity?.type||l.journal).length;
    const avgP=logged?Math.round(Object.values(logs).reduce((s,l)=>s+rc(l.meals||[]).p,0)/logged):0;
    const lastLog=Object.entries(logs).filter(([,l])=>l.meals?.length||l.activity?.type).sort((a,b)=>b[0].localeCompare(a[0]))[0];
    const todayOk=!!(logs[T]?.meals?.length||logs[T]?.activity?.type);
    html+=`<div class="pcrd" onclick="viewPat('${p.id}')">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="pavtr">${p.name?.[0]||'?'}</div>
        <div style="flex:1"><div style="font-size:14px;font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--mut);margin-top:2px">${p.age||'?'} · ${p.gender||''} · ${p.id}</div></div>
        <div class="sdot ${todayOk?'dok':'dwn'}">${todayOk?'✓':'!'}</div>
      </div>
      <div class="psts">
        <div class="pst"><div class="pstv">${logged}/${days}</div><div class="pstl">days logged</div></div>
        <div class="pst"><div class="pstv" style="color:#4ade80">${avgP}g</div><div class="pstl">avg protein</div></div>
        <div class="pst"><div class="pstv">${lastLog?fdate(lastLog[0]):'Never'}</div><div class="pstl">last active</div></div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${p.goal?`<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:var(--fnt);color:var(--mut)">${p.goal}</span>`:''}
        ${p.conditions?`<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(251,191,36,.1);color:var(--yel)">⚕ ${p.conditions}</span>`:''}
      </div>
    </div>`;
  }
  html+=`</div>`;
  document.getElementById('pgc').innerHTML=html;
}

async function viewPat(pid) {
  showL('Loading...');
  const p=await getP(pid);
  const logs=await logsN(pid,30);
  const notes=await getNotes(pid);
  hideL();
  const ld=Object.keys(logs).filter(d=>logs[d].meals?.length||logs[d].activity?.type||logs[d].journal).sort((a,b)=>b.localeCompare(a));
  const avg={p:0,c:0,f:0,cal:0,fi:0,energy:0,sleep:0,water:0};
  ld.forEach(d=>{const t=rc(logs[d].meals||[]);avg.p+=t.p;avg.c+=t.c;avg.f+=t.f;avg.cal+=t.cal;avg.fi+=t.fi;avg.energy+=logs[d].energy||0;avg.sleep+=logs[d].sleep||0;avg.water+=logs[d].water||0;});
  const n=ld.length||1;
  Object.keys(avg).forEach(k=>avg[k]=Math.round(avg[k]/n*10)/10);
  const actC={};
  ld.forEach(d=>{const t=logs[d].activity?.type;if(t)actC[t]=(actC[t]||0)+1;});
  window._PD={p,logs,ld,avg};

  document.getElementById('pgc').innerHTML=`
  <div>
    <button onclick="loadDocPats()" style="background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;padding:0 0 14px">← All patients</button>
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div class="pavtr lg">${p.name?.[0]}</div>
      <div style="flex:1">
        <div style="font-family:'Syne';font-size:20px;font-weight:700">${p.name}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:2px">${p.age||'?'} · ${p.gender||''} · ${p.dietStyle||''}</div>
        <div style="font-size:12px;color:var(--mut)">Goal: ${p.goal||'—'} · ID: ${pid}</div>
        ${p.conditions?`<div style="font-size:11px;color:var(--yel);background:rgba(251,191,36,.1);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px">⚕ ${p.conditions}</div>`:''}
      </div>
      <button class="bsm" style="background:rgba(129,140,248,.2);color:#818cf8;border:1px solid rgba(129,140,248,.3)" onclick="genAI('${pid}')">🤖 AI Summary</button>
    </div>
    <div id="aibox" style="display:none" class="aibox">
      <div style="font-size:11px;color:#818cf8;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">🤖 AI Patient Summary</div>
      <div id="aic" style="font-size:13px;color:#ccc;line-height:1.85;white-space:pre-wrap">Generating...</div>
    </div>
    <div class="dtabs">
      <button class="dtab on" onclick="dTab('nutrition',this)">Nutrition</button>
      <button class="dtab" onclick="dTab('activity',this)">Activity</button>
      <button class="dtab" onclick="dTab('logs',this)">Daily logs</button>
      <button class="dtab" onclick="dTab('notes',this)">Notes</button>
      <button class="dtab" onclick="dTab('targets',this)">Targets</button>
    </div>

    <div id="dt-nutrition">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">30-day averages (${ld.length} days logged)</div>
      <div class="agrd">
        ${ac('Avg protein',avg.p+'g',p.targets?.protein,'g','#4ade80')}
        ${ac('Avg calories',avg.cal+' kcal',p.targets?.calories,' kcal','#fbbf24')}
        ${ac('Avg carbs',avg.c+'g',null,null,'#60a5fa')}
        ${ac('Avg fat',avg.f+'g',null,null,'#f472b6')}
        ${ac('Avg fibre',avg.fi+'g',null,null,'#fb923c')}
        ${ac('Avg water',avg.water+'L',null,null,'#67e8f9')}
        ${ac('Avg energy',avg.energy+'/10',null,null,'#a78bfa')}
        ${ac('Avg sleep',avg.sleep+'/10',null,null,'#818cf8')}
      </div>
    </div>

    <div id="dt-activity" style="display:none">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Activity breakdown</div>
      ${Object.entries(actC).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--fnt)">
          <div style="font-size:12px;width:180px;flex-shrink:0">${t}</div>
          <div style="flex:1;height:6px;background:var(--fnt);border-radius:3px;overflow:hidden"><div style="height:100%;background:var(--acc);border-radius:3px;width:${Math.round(c/ld.length*100)}%"></div></div>
          <div style="font-size:12px;color:var(--mut);font-family:'DM Mono';width:40px;text-align:right">${c}d</div>
        </div>`).join('')||'<div class="empty">No activity data</div>'}
    </div>

    <div id="dt-logs" style="display:none">
      ${ld.slice(0,14).map(d=>{const l=logs[d],t=rc(l.meals||[]);return `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--fnt);flex-wrap:wrap"><div style="width:110px;font-size:13px;font-weight:500">${fdate(d)}</div><div style="flex:1;font-size:12px;color:var(--mut)">${l.activity?.type||'—'}</div><div style="font-size:11px;font-family:'DM Mono';color:var(--mut)">P:${t.p}g ${t.cal}kcal ${l.meals?.length||0}m</div></div>`;}).join('')||'<div class="empty">No logs yet</div>'}
    </div>

    <div id="dt-notes" style="display:none">
      <div style="margin-bottom:14px">
        <label class="fl">Write note for ${p.name}</label>
        <textarea class="ft" id="newnote" rows="3" placeholder="Recommendations, observations, instructions for patient..."></textarea>
        <button class="bsm" style="margin-top:8px;width:100%" onclick="sendNote('${pid}')">Send note to patient</button>
      </div>
      ${notes.map(n=>`<div class="notecard"><div style="font-size:11px;color:var(--mut);margin-bottom:4px">${new Date(n.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><div style="font-size:13px;line-height:1.6">${n.note}</div></div>`).join('')}
      ${notes.length===0?'<div class="empty">No notes yet</div>':''}
    </div>

    <div id="dt-targets" style="display:none">
      <div style="max-width:280px;display:flex;flex-direction:column;gap:10px">
        <div><label class="fl">Daily protein (g)</label><input class="fi" id="tgtp" type="number" value="${p.targets?.protein||100}"></div>
        <div><label class="fl">Daily calories (kcal)</label><input class="fi" id="tgtc" type="number" value="${p.targets?.calories||2000}"></div>
        <div><label class="fl">Activity days/week</label><input class="fi" id="tgta" type="number" value="${p.targets?.activityDays||4}" min="0" max="7"></div>
        <button class="bsm" style="width:100%" onclick="saveTgts('${pid}')">Save targets</button>
        <div id="tgtsaved" style="display:none" class="okb">✓ Targets updated</div>
      </div>
    </div>
    <div style="height:30px"></div>
  </div>`;
}

function dTab(tab,el){
  document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  ['nutrition','activity','logs','notes','targets'].forEach(t=>{const e=document.getElementById('dt-'+t);if(e)e.style.display=t===tab?'block':'none';});
}

function ac(label,val,target,unit,color){
  return `<div class="acrd"><div style="font-size:10px;color:var(--mut);text-transform:uppercase;margin-bottom:4px">${label}</div><div style="font-family:'DM Mono';font-size:17px;font-weight:600;color:${color}">${val}</div>${target?`<div style="font-size:10px;color:var(--mut)">Target: ${target}${unit}</div>`:''}</div>`;
}

async function genAI(pid) {
  const box=document.getElementById('aibox'),ct=document.getElementById('aic');
  if(!box){alert('Please scroll up — AI box not visible');return;}
  box.style.display='block'; ct.textContent='Generating summary...';
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
  const {p,logs,ld,avg}=window._PD||{};
  if(!ld?.length){ct.textContent='No logged data yet. AI summary needs at least 1 day of data.';return;}
  try {
    const rs=ld.slice(0,7).map(d=>{
      const l=logs[d],t=rc(l.meals||[]);
      return `${fdate(d)}: activity=${l.activity?.type||'none'} protein=${t.p}g cal=${t.cal} energy=${l.energy||'?'}/10 sleep=${l.sleep||'?'}/10 meals=[${(l.meals||[]).map(m=>m.name).join(', ')||'none'}] notes="${(l.journal||'').substring(0,80)}"`;
    }).join('\n');
    const prompt=`Healthcare professional reviewing patient data.\n\nPatient: ${p.name}, ${p.age||'?'} yrs, ${p.gender||''}\nDiet: ${p.dietStyle||'?'} | Goal: ${p.goal||'?'} | Conditions: ${p.conditions||'None'} | Allergies: ${p.allergies||'None'}\nTargets: Protein ${p.targets?.protein||100}g/day, Calories ${p.targets?.calories||2000}/day\n\n30-day averages (${ld.length} days):\nProtein ${avg.p}g | Calories ${avg.cal} | Carbs ${avg.c}g | Fat ${avg.f}g | Fibre ${avg.fi}g | Water ${avg.water}L | Energy ${avg.energy}/10 | Sleep ${avg.sleep}/10\n\nRecent 7 days:\n${rs}\n\nProvide:\nOVERALL STATUS: Good/Needs attention/Concerning\nNUTRITION ANALYSIS:\nACTIVITY PATTERN:\nAREAS OF CONCERN:\nRECOMMENDATIONS: (3 specific actions)\n\nUnder 250 words. Professional.`;
    const result=await gCall(prompt);
    ct.textContent=result||'Empty response from AI. Check API key quota.';
  } catch(e){ct.textContent='Error: '+e.message;}
}

async function sendNote(pid) {
  const note=(document.getElementById('newnote').value||'').trim();
  if(!note)return;
  await addNote(pid,note);
  document.getElementById('newnote').value='';
  alert('Note sent to patient!');
  await viewPat(pid);
  dTab('notes',document.querySelectorAll('.dtab')[3]);
}

async function saveTgts(pid) {
  const targets={protein:parseInt(document.getElementById('tgtp').value)||100,calories:parseInt(document.getElementById('tgtc').value)||2000,activityDays:parseInt(document.getElementById('tgta').value)||4};
  await setP(pid,{targets});
  if(window._PD)window._PD.p.targets=targets;
  document.getElementById('tgtsaved').style.display='block';
}

async function loadAlerts() {
  showL('Checking...');
  const patients=await allP();
  const T=today();
  const crit=[],warn=[];
  for(const p of patients){
    const logs=await logsN(p.id,7);
    let consec=0;
    for(let i=0;i<7;i++){const d=shift(T,-i);if(!logs[d]?.meals?.length&&!logs[d]?.activity?.type&&!logs[d]?.journal)consec++;else break;}
    const ldays=Object.values(logs).filter(l=>l.meals?.length);
    const avgP=ldays.length?ldays.reduce((s,l)=>s+rc(l.meals||[]).p,0)/ldays.length:0;
    const sedentary=Object.values(logs).filter(l=>l.activity?.type==='Sedentary / desk day').length;
    const highPain=Object.values(logs).filter(l=>(l.pain||0)>=7).length;
    if(consec>=3)crit.push({pid:p.id,name:p.name,icon:'📵',msg:`Not logged in ${consec} consecutive days`,bg:'rgba(248,113,113,.15)'});
    if(ldays.length>=3&&avgP<(p.targets?.protein||100)*0.5)crit.push({pid:p.id,name:p.name,icon:'⚠️',msg:`Protein critically low: avg ${Math.round(avgP)}g vs ${p.targets?.protein||100}g target`,bg:'rgba(248,113,113,.15)'});
    if(highPain>=2)warn.push({pid:p.id,name:p.name,icon:'🔴',msg:`High pain (7+/10) on ${highPain} days this week`,bg:'rgba(251,191,36,.15)'});
    if(sedentary>=5)warn.push({pid:p.id,name:p.name,icon:'🪑',msg:`${sedentary} sedentary days this week`,bg:'rgba(251,191,36,.15)'});
    if(ldays.length>=3&&avgP<(p.targets?.protein||100)*0.75&&avgP>=(p.targets?.protein||100)*0.5)warn.push({pid:p.id,name:p.name,icon:'🥗',msg:`Low protein: avg ${Math.round(avgP)}g/day`,bg:'rgba(251,191,36,.15)'});
  }
  hideL();
  const all=[...crit,...warn];
  document.getElementById('pgc').innerHTML=`
  <button onclick="loadDocPats()" style="background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;padding:0 0 14px">← All patients</button>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="font-family:'Syne';font-size:18px;font-weight:700">${all.length} alerts</div>
    <div style="font-size:12px;color:var(--mut)">${crit.length} critical · ${warn.length} warnings</div>
  </div>
  ${all.length===0?'<div class="empty" style="margin-top:40px">✅ All patients on track. No alerts.</div>':''}
  ${crit.length?`<div style="font-size:11px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Critical</div>`:''}
  ${crit.map(a=>`<div class="alertrow" onclick="viewPat('${a.pid}')"><div class="aicon" style="background:${a.bg}">${a.icon}</div><div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--mut);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--mut);margin-top:2px">${a.msg}</div></div></div>`).join('')}
  ${warn.length?`<div style="font-size:11px;color:var(--yel);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 8px">Warnings</div>`:''}
  ${warn.map(a=>`<div class="alertrow" onclick="viewPat('${a.pid}')"><div class="aicon" style="background:${a.bg}">${a.icon}</div><div><div style="font-size:14px;font-weight:600">${a.name} <span style="color:var(--mut);font-size:11px">${a.pid}</span></div><div style="font-size:12px;color:var(--mut);margin-top:2px">${a.msg}</div></div></div>`).join('')}`;
}

// ── INIT ─────────────────────────────────────────────────────
showPin();
</script>
</body>
